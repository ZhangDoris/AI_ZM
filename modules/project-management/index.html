<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>项目管理 - AI智能预筛系统</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5; color: #333; font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ===== 顶栏 ===== */
.top-bar {
  height: 52px; background: linear-gradient(90deg, #dfe7fb 0%, #eef2fd 45%, #f6f8fe 100%);
  display: flex; align-items: center; padding: 0 20px 0 16px; flex-shrink: 0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: relative; z-index: 200;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand .idy { font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: -1px; color: #e53935; line-height: 1; }
.brand .idy em { color: #1a1a1a; font-style: italic; }
.brand .brand-divider { width: 2px; height: 20px; background: #d0d0d0; margin: 0 4px; }
.brand .brand-name { font-size: 15px; font-weight: 600; color: #444; letter-spacing: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.tb-btn {
  height: 30px; padding: 0 14px; border: none; border-radius: 6px;
  background: linear-gradient(135deg, #3d7bff, #2b62e8); color: #fff;
  font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 2px 6px rgba(43,98,232,0.3); transition: filter .15s, transform .15s;
}
.tb-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.tb-version { font-size: 13px; color: #666; }
.tb-user { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background .15s; }
.tb-user:hover { background: rgba(255,255,255,0.6); }
.tb-avatar {
  width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 13px;
  background: linear-gradient(135deg, #4a90e2, #2b62e8);
  display: flex; align-items: center; justify-content: center; font-weight: 600;
}
.tb-user .u-name { font-size: 13px; color: #333; }
.tb-logout { color: #555; font-size: 15px; cursor: pointer; }
.tb-logout:hover { color: #2b62e8; }

/* ===== 主体布局 ===== */
.layout { flex: 1; display: flex; min-height: 0; }

/* 侧边栏 */
.sidebar {
  width: 132px; background: #ffffff; border-right: 1px solid #eceef2;
  display: flex; flex-direction: column; padding: 10px 8px; overflow-y: auto; flex-shrink: 0;
}
.side-item {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px; margin-bottom: 2px; border-radius: 8px;
  color: #333; font-size: 13.5px; cursor: pointer; transition: background .15s, color .15s;
  white-space: nowrap; user-select: none;
}
.side-item .s-icon { width: 18px; text-align: center; font-size: 14px; color: #5a6474; transition: color .15s; flex-shrink: 0; }
.side-item:hover { background: #f0f5ff; color: #2b62e8; }
.side-item:hover .s-icon { color: #2b62e8; }
.side-item.active { background: #2f6bff; color: #fff; font-weight: 600; box-shadow: 0 3px 8px rgba(47,107,255,0.35); }
.side-item.active .s-icon { color: #fff; }
.side-group-arrow { margin-left: auto; font-size: 10px; color: #b0b6c0; }

/* 内容区 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 18px; overflow-y: auto; }
.page-header { display: flex; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
.page-title { font-size: 17px; font-weight: 700; color: #1a1a1a; }
.page-actions { margin-left: auto; display: flex; gap: 10px; }
.btn {
  height: 32px; padding: 0 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
  border: 1px solid #d9dce3; background: #fff; color: #333;
  display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
}
.btn:hover { color: #2b62e8; border-color: #2b62e8; }
.btn-primary { background: #2f6bff; border-color: #2f6bff; color: #fff; box-shadow: 0 2px 6px rgba(47,107,255,0.3); }
.btn-primary:hover { background: #4a7fff; border-color: #4a7fff; color: #fff; }

.card {
  background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  padding: 0 20px 16px; flex-shrink: 0;
}

/* Tabs */
.tabs { display: flex; gap: 28px; border-bottom: 1px solid #eceef2; }
.tab {
  padding: 12px 2px 10px; font-size: 14px; color: #555; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; user-select: none;
}
.tab:hover { color: #2b62e8; }
.tab.active { color: #2b62e8; font-weight: 600; border-bottom-color: #2b62e8; }

/* 筛选区 */
.filters { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; padding: 14px 0 4px; }
.filter-item { display: flex; align-items: center; gap: 8px; }
.filter-item label { font-size: 13px; color: #333; white-space: nowrap; }
.filter-item input {
  width: 170px; height: 32px; padding: 0 10px; border: 1px solid #d9dce3; border-radius: 6px;
  font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; background: #fff;
}
.filter-item input::placeholder { color: #b8bfc9; }
.filter-item input:focus { border-color: #2b62e8; box-shadow: 0 0 0 3px rgba(43,98,232,0.1); }
.btn-search { background: #2f6bff; border-color: #2f6bff; color: #fff; }
.btn-search:hover { background: #4a7fff; border-color: #4a7fff; color: #fff; }

/* 表格 */
.table-wrap { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 1100px; }
thead th {
  background: #f5f7fa; color: #5a6474; font-weight: 600; font-size: 13px; text-align: left;
  padding: 11px 12px; white-space: nowrap; border-bottom: 1px solid #eceef2;
}
tbody td { padding: 12px; font-size: 13px; color: #333; border-bottom: 1px solid #f2f4f7; vertical-align: middle; }
tbody tr:hover { background: #f7faff; }
.td-code { color: #2b62e8; cursor: pointer; white-space: nowrap; }
.td-code:hover { text-decoration: underline; }
.td-title { max-width: 300px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
.td-time { color: #2b62e8; white-space: nowrap; }
.op-cell { white-space: nowrap; }
.op-link { color: #2b62e8; cursor: pointer; font-size: 13px; }
.op-link:hover { text-decoration: underline; }
.op-link.danger { color: #f53f3f; }
.op-more-wrap { display: inline-block; }

/* 更多气泡：挂在 body 上，JS 定位，水平居中于「更多」下方（与截图一致） */
#morePopover {
  position: fixed; z-index: 600;
  background: #fff; border-radius: 4px;
  box-shadow: 0 3px 14px rgba(0,0,0,0.16);
  padding: 8px 0; min-width: 96px; display: none; text-align: left;
}
#morePopover .pop-item {
  display: block; padding: 6px 18px; font-size: 13px; color: #333;
  cursor: pointer; white-space: nowrap; text-align: left;
}
#morePopover .pop-item:hover { background: #f5f7fa; color: #2b62e8; }

.empty-row td { text-align: center; color: #999; padding: 40px 0; }

/* 分页 */
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 16px; font-size: 13px; color: #555; flex-wrap: wrap; }
.page-btn {
  min-width: 28px; height: 28px; padding: 0 6px; border: 1px solid #d9dce3; border-radius: 6px;
  background: #fff; color: #333; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; transition: all .15s;
}
.page-btn:hover:not(:disabled) { color: #2b62e8; border-color: #2b62e8; }
.page-btn.active { background: #2f6bff; border-color: #2f6bff; color: #fff; }
.page-btn:disabled { color: #c0c4cc; cursor: not-allowed; background: #f7f8fa; }
.page-ellipsis { color: #999; padding: 0 2px; }
.page-size { height: 28px; border: 1px solid #d9dce3; border-radius: 6px; font-size: 13px; padding: 0 6px; outline: none; background: #fff; }
.page-jump input { width: 44px; height: 28px; border: 1px solid #d9dce3; border-radius: 6px; text-align: center; font-size: 13px; outline: none; }
.page-jump input:focus { border-color: #2b62e8; }

/* 机器人 */
.robot-float {
  position: fixed; right: 18px; bottom: 24px; width: 52px; height: 52px; z-index: 300;
  border-radius: 50%; background: linear-gradient(135deg, #4a90e2, #2b62e8);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 6px 18px rgba(43,98,232,0.4); transition: transform .2s;
  animation: robotBob 3s ease-in-out infinite;
}
.robot-float:hover { transform: scale(1.1); }
.robot-float i { color: #fff; font-size: 24px; }
@keyframes robotBob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }

/* Toast */
.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-16px);
  background: #fff; border: 1px solid #eceef2; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  padding: 10px 20px; border-radius: 8px; font-size: 13.5px; color: #333; z-index: 999;
  opacity: 0; pointer-events: none; transition: all .25s; display: flex; align-items: center; gap: 8px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast i { color: #00b42a; }

/* 删除确认弹窗 */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 500;
  display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  width: 380px; background: #fff; border-radius: 12px; padding: 24px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.2); animation: modalIn .2s ease;
}
@keyframes modalIn { from { transform: scale(.92); opacity: 0;} to { transform: scale(1); opacity: 1;} }
.modal h3 { font-size: 16px; margin-bottom: 12px; color: #1a1a1a; }
.modal p { font-size: 13.5px; color: #555; line-height: 1.6; margin-bottom: 20px; }
.modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
.btn-danger { background: #f53f3f; border-color: #f53f3f; color: #fff; }
.btn-danger:hover { background: #ff6666; border-color: #ff6666; color: #fff; }

/* 筛选系统弹窗（智能单选） */
.sys-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.sys-opt {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border: 1px solid #d9dce3; border-radius: 8px; cursor: pointer; transition: all .15s;
}
.sys-opt:hover { border-color: #2b62e8; background: #f7faff; }
.sys-opt input { width: 16px; height: 16px; accent-color: #2b62e8; cursor: pointer; }
.sys-opt-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.sys-opt-tag { font-size: 11px; color: #fff; background: #2f6bff; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
.sys-opt-desc { font-size: 12px; color: #999; margin-left: auto; }
.sys-opt:has(input:checked) { border-color: #2b62e8; background: #eef3ff; box-shadow: 0 0 0 2px rgba(43,98,232,0.12); }

/* 响应式 */
@media (max-width: 900px) {
  .sidebar { width: 52px; padding: 10px 4px; }
  .side-item { justify-content: center; padding: 10px 0; }
  .side-item .s-label { display: none; }
  .side-item .s-icon { width: auto; font-size: 16px; }
  .side-group-arrow { display: none; }
  .filter-item input { width: 130px; }
}
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="top-bar">
  <div class="brand">
    <span class="idy">ID<em>Y</em></span>
    <span class="brand-divider"></span>
    <span class="brand-name">艾迪研</span>
  </div>
  <div class="top-right">
    <button class="tb-btn" onclick="showToast('问题反馈入口（演示）')"><i class="fa-regular fa-comment-dots"></i>问题反馈</button>
    <button class="tb-btn" onclick="showToast('操作说明（演示）')"><i class="fa-regular fa-circle-question"></i>操作说明</button>
    <span class="tb-version">版本 V2.5</span>
    <div class="tb-user" onclick="showToast('个人中心（演示）')">
      <span class="tb-avatar">张</span><span class="u-name">张琳</span>
    </div>
    <i class="fa-solid fa-arrow-right-from-bracket tb-logout" title="退出登录" onclick="showToast('退出登录（演示）')"></i>
  </div>
</header>

<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="side-item" data-menu><i class="fa-solid fa-gauge-high s-icon"></i><span class="s-label">运营看板</span></div>
    <div class="side-item active" data-menu><i class="fa-solid fa-folder-open s-icon"></i><span class="s-label">项目管理</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-file-lines s-icon"></i><span class="s-label">内容管理</span><i class="fa-solid fa-chevron-down side-group-arrow"></i></div>
    <div class="side-item" data-menu><i class="fa-regular fa-thumbs-up s-icon"></i><span class="s-label">意见反馈</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-gear s-icon"></i><span class="s-label">系统设置</span><i class="fa-solid fa-chevron-down side-group-arrow"></i></div>
    <div class="side-item" data-menu><i class="fa-solid fa-clipboard-check s-icon"></i><span class="s-label">审评跟踪</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-hospital-user s-icon"></i><span class="s-label">病例记录</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-box-archive s-icon"></i><span class="s-label">暂存记录</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-tags s-icon"></i><span class="s-label">标签管理</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-download s-icon"></i><span class="s-label">下载中心</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-building s-icon"></i><span class="s-label">企微数据</span></div>
    <div class="side-item" data-menu><i class="fa-solid fa-screwdriver-wrench s-icon"></i><span class="s-label">运维配置</span><i class="fa-solid fa-chevron-down side-group-arrow"></i></div>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <div class="page-header">
      <span class="page-title">项目管理</span>
      <div class="page-actions">
        <button class="btn" onclick="showToast('资料导出（演示）')"><i class="fa-solid fa-file-export"></i>资料导出</button>
        <button class="btn" onclick="showToast('统计分析下载（演示）')"><i class="fa-solid fa-chart-line"></i>统计分析下载</button>
        <button class="btn btn-primary" onclick="showToast('新增项目（演示）')"><i class="fa-solid fa-plus"></i>新增</button>
      </div>
    </div>

    <section class="card">
      <!-- Tabs -->
      <div class="tabs" id="tabs">
        <div class="tab active" data-status="">全部</div>
        <div class="tab" data-status="executing">执行中</div>
        <div class="tab" data-status="prelaunch">待立项</div>
        <div class="tab" data-status="prerelease">待发布</div>
        <div class="tab" data-status="done">已完成</div>
      </div>

      <!-- 筛选 -->
      <div class="filters">
        <div class="filter-item"><label>项目编号</label><input id="f-code" placeholder="请输入项目编号"/></div>
        <div class="filter-item"><label>标题</label><input id="f-title" placeholder="请输入标题"/></div>
        <div class="filter-item"><label>PM</label><input id="f-pm" placeholder="请输入PM姓名"/></div>
        <button class="btn btn-search" onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i>查询</button>
        <button class="btn" onclick="doReset()"><i class="fa-solid fa-rotate-right"></i>重置</button>
      </div>

      <!-- 表格 -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目编号</th><th>标题</th><th>PM</th><th>CRC</th><th>研究者</th>
              <th>患者</th><th>是否上传外部EDC文件</th><th>更新人</th><th>更新时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination">
        <span>共 <b id="total">0</b> 条</span>
        <select class="page-size" id="pageSize" onchange="changePageSize(this.value)">
          <option value="10" selected>10条/页</option>
          <option value="20">20条/页</option>
          <option value="50">50条/页</option>
        </select>
        <button class="page-btn" id="prevBtn" onclick="goPage(curPage-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="pageBtns"></span>
        <button class="page-btn" id="nextBtn" onclick="goPage(curPage+1)"><i class="fa-solid fa-chevron-right"></i></button>
        <span class="page-jump">前往 <input id="jumpInput" value="1"/> 页</span>
      </div>
    </section>
  </main>
</div>

<!-- 机器人 -->
<div class="robot-float" title="智能助手" onclick="showToast('智能助手（演示）')"><i class="fa-solid fa-robot"></i></div>

<!-- 更多弹出气泡（挂 body，水平居中于「更多」下方） -->
<div id="morePopover">
  <span class="pop-item" onclick="hideMore();showToast('一键导入（演示）')">一键导入</span>
  <span class="pop-item" onclick="hideMore();showToast('导入EDC（演示）')">导入EDC</span>
  <span class="pop-item" onclick="hideMore();openSysModal()">筛选系统</span>
</div>

<!-- Toast -->
<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastMsg"></span></div>

<!-- 删除确认 -->
<div class="modal-mask" id="delModal">
  <div class="modal">
    <h3>删除确认</h3>
    <p>确定要删除项目 <b id="delCode"></b> 吗？删除后不可恢复。</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeDelModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- 筛选系统弹窗（智能单选） -->
<div class="modal-mask" id="sysModal">
  <div class="modal">
    <h3>选择预筛系统</h3>
    <p style="margin-bottom:14px">请选择在哪个系统中进行智能预筛：</p>
    <div class="sys-options">
      <label class="sys-opt">
        <input type="radio" name="sys" value="艾康逸" checked/>
        <span class="sys-opt-name">艾康逸</span>
        <span class="sys-opt-desc">艾康逸智能预筛引擎</span>
      </label>
      <label class="sys-opt">
        <input type="radio" name="sys" value="协调部"/>
        <span class="sys-opt-name">协调部</span>
        <span class="sys-opt-desc">协调部预筛系统</span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSysModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmSys()">确定</button>
    </div>
  </div>
</div>

<script>
/* ===== 模拟数据 ===== */
const TITLES = [
  '诱导化胞免疫同步放化疗对比同步放化疗后免疫治疗用于不可手术的局部晚期食管鳞癌的前瞻性随机对照研究',
  'HRS-6209联合来赛捷利尤单抗或安慰剂联合食管癌标准治疗化疗制剂（AI）治疗晚期食管鳞癌的III期临床研究',
  '一项在系统性红斑狼疮成人患者中评价艾拉库珠单抗的安全性、耐受性、疗效、免疫药代动力的多中心研究',
  '维康曲妥单抗联合atezolizumab对比帕博利珠单抗联合化疗治疗HER2阴性且NSCLC的III期研究',
  'Change CSV PQ test',
  '槐黄艾玛妥替尼片治疗成人中重度斑块状银屑病的疗效及安全研究',
  '阿帕贝尼珠单抗联合化疗用于可切除胆道癌患性患者切除的随机对照临床研究',
  '抗PD-1和TIGIT双特异性抗体治疗晚期恶性肿瘤的I期研究（SWORD）',
  'CSV PQ test',
  '维康曲妥单抗在早期辅助、晚期HER2阳性乳腺癌总体乳腺癌的疗效及安全性：一项多中心研究'
];
const CODES = ['MA-EC-II-03','HRS-6209-302','ICP-CL-00132','MA-NSCLC-IV-058','CSV-PQ02','MA-DER-RWS-102','MA-BTC-III-014','MA-IIC-II-006','CSV-PQ','OBI-BC-RWS-269'];
const PMS = ['韩格','王静','管理员','韩格','陈兆森','潘泓双','朱洪剑','白慧','','李娜'];
const UPS = ['韩格','刘炎','于晨','陈梦瑶','测试CRC','汪经理','吴凯旭','朱小凡','测试CRC','张雪'];
const STATUSES = ['executing','prelaunch','prerelease','done'];

const RECORDS = [];
for (let i = 0; i < 348; i++) {
  const base = i % 10;
  RECORDS.push({
    code: i < 10 ? CODES[i] : 'MA-RS-' + String(1000 + i),
    title: i < 10 ? TITLES[i] : TITLES[base] + '（' + (i + 1) + '）',
    pm: i < 10 ? PMS[i] : PMS[base],
    crc: [1,1,2,1,1,1,1,1,1,4][base],
    researcher: [1,1,1,1,3,1,1,1,3,0][base],
    patient: [1,1,1,1,2,1,1,1,2,0][base],
    edc: i % 7 === 3 ? '是' : '否',
    updater: i < 10 ? UPS[i] : UPS[base],
    time: '2026-09-' + String(28 - (i % 25)).padStart(2,'0'),
    status: STATUSES[i % 4]
  });
}

let curPage = 1, curSize = 10, curStatus = '';
let filters = { code: '', title: '', pm: '' };
let deletingCode = null;

function getFiltered() {
  return RECORDS.filter(r => {
    if (curStatus && r.status !== curStatus) return false;
    if (filters.code && !r.code.toLowerCase().includes(filters.code.toLowerCase())) return false;
    if (filters.title && !r.title.includes(filters.title)) return false;
    if (filters.pm && !r.pm.includes(filters.pm)) return false;
    return true;
  });
}

function render() {
  const list = getFiltered();
  const totalPages = Math.max(1, Math.ceil(list.length / curSize));
  if (curPage > totalPages) curPage = totalPages;
  const start = (curPage - 1) * curSize;
  const rows = list.slice(start, start + curSize);
  document.getElementById('total').textContent = list.length;

  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10"><i class="fa-regular fa-folder-open" style="margin-right:8px"></i>暂无数据</td></tr>';
  } else {
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td class="td-code" onclick="showToast('查看项目 ${r.code}（演示）')">${r.code}</td>
        <td><span class="td-title" title="${r.title}">${r.title}</span></td>
        <td>${r.pm || '-'}</td>
        <td>${r.crc}</td>
        <td>${r.researcher}</td>
        <td>${r.patient}</td>
        <td>${r.edc}</td>
        <td>${r.updater}</td>
        <td class="td-time">${r.time}</td>
        <td class="op-cell">
          <span class="op-link" onclick="showToast('查看 ${r.code}（演示）')">查看</span>
          <span class="op-link" style="margin-left:8px" onclick="showToast('编辑 ${r.code}（演示）')">编辑</span>
          <span class="op-link danger" style="margin-left:8px" onclick="openDelModal('${r.code}')">删除</span>
          <span class="op-more-wrap" style="margin-left:8px">
            <span class="op-link" onclick="toggleMore(event, this)">更多 <i class="fa-solid fa-chevron-down" style="font-size:10px"></i></span>
          </span>
        </td>
      </tr>`).join('');
  }
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  let html = '';
  const pages = [];
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1,2,3,4,5,'...',totalPages);
  }
  pages.forEach(p => {
    if (p === '...') html += '<span class="page-ellipsis">•••</span>';
    else html += `<button class="page-btn ${p === curPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
  });
  document.getElementById('pageBtns').innerHTML = html;
  document.getElementById('prevBtn').disabled = curPage <= 1;
  document.getElementById('nextBtn').disabled = curPage >= totalPages;
  document.getElementById('jumpInput').value = curPage;
}

function goPage(p) {
  const totalPages = Math.max(1, Math.ceil(getFiltered().length / curSize));
  if (p < 1 || p > totalPages) return;
  curPage = p; render();
}
function changePageSize(v) { curSize = +v; curPage = 1; render(); }
function doSearch() {
  filters = { code: val('f-code'), title: val('f-title'), pm: val('f-pm') };
  curPage = 1; render();
}
function val(id) { return document.getElementById(id).value.trim(); }
function doReset() {
  ['f-code','f-title','f-pm'].forEach(id => document.getElementById(id).value = '');
  filters = { code:'', title:'', pm:'' }; curStatus = ''; curPage = 1;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.status === ''));
  render();
}
document.getElementById('jumpInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') goPage(parseInt(e.target.value) || 1);
});

/* Tabs */
document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    curStatus = tab.dataset.status; curPage = 1; render();
  });
});

/* 侧边栏 */
document.querySelectorAll('[data-menu]').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('[data-menu]').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
  });
});

/* ===== 更多弹出气泡 =====
   气泡挂在 body 上（避免被表格滚动容器裁剪），
   显示时在「更多」正下方水平居中，与截图效果一致 */
const morePopover = document.getElementById('morePopover');

function toggleMore(e, el) {
  e.stopPropagation();
  const isOpen = morePopover.style.display === 'block';
  hideMore();
  if (!isOpen) {
    morePopover.style.display = 'block';
    const r = el.getBoundingClientRect();
    const pr = morePopover.getBoundingClientRect();
    let top = r.bottom + 6;                                   /* 紧贴「更多」下方 */
    let left = r.left + r.width / 2 - pr.width / 2;           /* 水平居中于「更多」 */
    if (left < 8) left = 8;
    if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - 8 - pr.width;
    if (top + pr.height > window.innerHeight) top = r.top - pr.height - 6;  /* 底部放不下则改到上方 */
    morePopover.style.top = top + 'px';
    morePopover.style.left = left + 'px';
  }
}
function hideMore() { morePopover.style.display = 'none'; }
document.addEventListener('click', hideMore);

/* 删除 */
function openDelModal(code) { deletingCode = code; document.getElementById('delCode').textContent = code; document.getElementById('delModal').classList.add('show'); }
function closeDelModal() { document.getElementById('delModal').classList.remove('show'); }
function confirmDelete() {
  const idx = RECORDS.findIndex(r => r.code === deletingCode);
  if (idx > -1) RECORDS.splice(idx, 1);
  closeDelModal(); showToast('删除成功'); render();
}
document.getElementById('delModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDelModal(); });

/* 筛选系统弹窗（智能单选） */
function openSysModal() { document.getElementById('sysModal').classList.add('show'); }
function closeSysModal() { document.getElementById('sysModal').classList.remove('show'); }
function confirmSys() {
  const sel = document.querySelector('input[name="sys"]:checked');
  closeSysModal();
  if (sel) showToast('已在「' + sel.value + '」系统中启动智能预筛');
}
document.getElementById('sysModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeSysModal(); });

/* Toast */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

render();
</script>
</body>
</html>

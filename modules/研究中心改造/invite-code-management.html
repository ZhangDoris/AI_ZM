<!--
  邀请码管理 - 产品原型
  功能：邀请码列表展示与管理，已邀请成员查看与启用/停用操作
  主题色：#1872a7
  Tab页：邀请码列表 | 已邀请成员
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请码管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #F5F7FA; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F5F7FA; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }

    .btn-click:active { transform: scale(0.96); }
    .form-input:focus { border-color: #1872a7; box-shadow: 0 0 0 3px rgba(24,114,167,0.12); outline: none; }

    /* 项目切换 Tab（上层） */
    .proj-tab {
      padding: 5px 16px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      color: #333;
      background: transparent;
      border: none;
    }
    .proj-tab:hover { color: #1872a7; }
    .proj-tab.active {
      color: #fff;
      background: #1872a7;
      font-weight: 500;
    }

    /* Tab 样式（下层） */
    .tab-item {
      padding: 6px 18px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      transition: all 0.15s;
      color: #666;
      background: transparent;
      border: 1px solid transparent;
      margin-right: -1px;
    }
    .tab-item:hover { color: #1872a7; background: rgba(24,114,167,0.04); }
    .tab-item.active {
      color: #fff;
      background: #1872a7;
      border-color: #1872a7;
      font-weight: 500;
    }

    /* 表格样式 */
    .inv-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; }
    .inv-table thead th {
      background: #F5F7FA;
      color: #333;
      font-weight: 600;
      padding: 10px 14px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid #e8e8e8;
    }
    .inv-table tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }
    .inv-table tbody tr:hover { background: rgba(24,114,167,0.03); }
    .inv-table tbody tr:nth-child(even) { background: #fafbfc; }
    .inv-table tbody tr:nth-child(even):hover { background: rgba(24,114,167,0.04); }

    /* 操作按钮 - 蓝色实心小按钮 */
    .btn-op {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      height: 26px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      color: #fff;
      background: #1872a7;
      white-space: nowrap;
    }
    .btn-op:hover { background: #145d8a; }
    .btn-op:active { transform: scale(0.95); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; background: #86909c; }
    .btn-primary:disabled:hover { background: #86909c; }

    /* 状态标签 */
    .status-active { color: #00B42A; font-size: 13px; }
    .status-inactive { color: #86909c; font-size: 13px; }

    /* 主按钮 */
    .btn-primary {
      background: #1872a7;
      color: #fff;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-primary:hover { background: #145d8a; }

    .btn-outline {
      background: #fff;
      color: #1872a7;
      border: 1px solid #1872a7;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-outline:hover { background: rgba(24,114,167,0.05); }

    /* Toast */
    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      padding: 12px 22px; border-radius: 8px; font-size: 14px; z-index: 9999;
      box-shadow: 0 6px 20px rgba(0,0,0,.14);
      animation: toastIn 0.25s ease; pointer-events: none; font-weight: 500;
      display: inline-flex; align-items: center;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .toast i { margin-right: 8px; font-size: 15px; }
    .toast-success { background: #e8ffea; color: #009a29; border: 1px solid #95de64; }
    .toast-error { background: #ffece8; color: #F53F3F; border: 1px solid #ffa39e; }
    .toast-warn {
      background: #fff1e6; color: #d4380d; border: 1px solid #ffbb96; font-weight: 600;
      animation: toastIn 0.25s ease, toastWarnPulse 1s ease-in-out 0.3s 2;
    }
    @keyframes toastWarnPulse {
      0%, 100% { box-shadow: 0 6px 20px rgba(0,0,0,.14); }
      50% { box-shadow: 0 0 0 5px rgba(255,125,0,.20), 0 6px 20px rgba(0,0,0,.14); }
    }
  </style>
</head>
<body class="min-h-screen">
  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-gray-200 px-6 py-2.5 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <span class="text-base font-semibold text-gray-800">成员管理</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[#1872a7] flex items-center justify-center text-white text-xs font-medium">张</div>
      <span class="text-sm text-gray-700">张琳</span>
      <i class="fas fa-chevron-down text-xs text-gray-400"></i>
    </div>
  </header>

  <!-- 项目切换（上层Tab） -->
  <div class="bg-white px-6 pt-4 pb-2 border-b border-gray-100">
    <div class="flex items-center gap-1">
      <div id="projTab0" class="proj-tab active" onclick="switchProject(0)">恒瑞医药</div>
      <div id="projTab1" class="proj-tab" onclick="switchProject(1)">江苏科信</div>
      <div id="projTab2" class="proj-tab" onclick="switchProject(2)">运营二部</div>
    </div>
  </div>


  <!-- 功能Tab切换（下层） -->
  <div class="bg-white px-6 pt-3 pb-0">
    <div class="flex items-end">
      <div id="tabInviteCode" class="tab-item active" onclick="switchTab('inviteCode')">邀请码</div>
      <div id="tabInvitedMember" class="tab-item" onclick="switchTab('invitedMember')">成员管理</div>
    </div>
  </div>

  <!-- ========== Tab 1: 邀请码列表 ========== -->
  <div id="panelInviteCode" class="bg-white mx-6 mt-0 rounded-b-lg shadow-sm">
    <!-- 搜索筛选栏 -->
    <div class="px-5 py-4 border-b border-gray-100 flex items-center gap-4 flex-wrap">
      <div class="flex items-center gap-2">
        <label class="text-[13px] text-gray-600 whitespace-nowrap">邀请码编号：</label>
        <input id="icFilterCode" type="text" placeholder="请输入" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-64 focus:outline-none" oninput="renderIcTable()">
      </div>
      <div class="flex items-center gap-2">
        <label class="text-[13px] text-gray-600 whitespace-nowrap">中心名称：</label>
        <input id="icFilterCenter" type="text" placeholder="请输入" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-56 focus:outline-none" oninput="renderIcTable()">
      </div>
      <button onclick="renderIcTable()" class="btn-primary"><i class="fas fa-search mr-1"></i>查询</button>
      <button onclick="resetIcFilter()" class="btn-outline"><i class="fas fa-redo-alt mr-1"></i>重置</button>
      <button onclick="generateInviteCode()" class="btn-primary ml-auto"><i class="fas fa-plus mr-1"></i>新建</button>
    </div>

    <!-- 表格 -->
    <div class="overflow-x-auto">
      <table class="inv-table">
        <thead>
          <tr>
            <th style="width:220px">方案编号</th>
            <th style="width:300px">中心名称</th>
            <th style="width:120px">创建人</th>
            <th style="width:280px;text-align:right;padding-right:24px">操作</th>
          </tr>
        </thead>
        <tbody id="icTableBody"></tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="px-5 py-3 flex items-center justify-between border-t border-gray-100">
      <span class="text-[12px] text-gray-500" id="icTotalCount">共 680 条</span>
      <div class="flex items-center gap-1">
        <select id="icPageSize" class="border border-gray-300 rounded px-2 py-1 text-[12px]" onchange="changeIcPage(1)">
          <option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option>
        </select>
        <button onclick="changeIcPage(icCurrentPage-1)" class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-chevron-left text-xs"></i></button>
        <span id="icPageNums" class="flex items-center gap-1"></span>
        <button onclick="changeIcPage(icCurrentPage+1)" class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-chevron-right text-xs"></i></button>
        <span class="ml-2 text-[12px] text-gray-400">前往</span>
        <input type="number" value="1" min="1" id="icGoPage" class="w-9 h-7 border border-gray-300 rounded text-center text-[12px] mx-1">
        <span class="text-[12px] text-gray-400">页</span>
        <button onclick="goIcPage()" class="ml-1 px-2 h-7 bg-white border border-gray-300 rounded text-[12px] text-gray-600 hover:text-gray-800 btn-click">跳转</button>
      </div>
    </div>
  </div>

  <!-- ========== Tab 2: 已邀请成员 ========== -->
  <div id="panelInvitedMember" class="hidden bg-white mx-6 mt-0 rounded-b-lg shadow-sm">
    <!-- 搜索筛选栏 -->
    <div class="px-5 py-4 border-b border-gray-100">
      <div class="flex items-center gap-4 flex-wrap">
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">方案编号：</label>
          <input id="imFilterProject" type="text" placeholder="请输入" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-40 focus:outline-none" oninput="renderImTable()">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">姓名：</label>
          <input id="imFilterName" type="text" placeholder="请输入" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-32 focus:outline-none" oninput="renderImTable()">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">手机号：</label>
          <input id="imFilterPhone" type="text" placeholder="请输入" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-36 focus:outline-none" oninput="renderImTable()">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">中心名称：</label>
          <input id="imFilterCenterName" type="text" placeholder="请输入中心名称" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-44 focus:outline-none" oninput="renderImTable()">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">中心号：</label>
          <input id="imFilterCenterNo" type="text" placeholder="如 CN001" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-32 focus:outline-none" oninput="renderImTable()">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">我邀请的CRC：</label>
          <select id="imFilterSelfInvite" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-28 focus:outline-none" onchange="renderImTable()">
            <option value="">全选</option>
            <option value="yes">是</option>
            <option value="no">否</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-600 whitespace-nowrap">状态：</label>
          <select id="imFilterStatus" class="form-input border border-gray-300 rounded px-3 py-1.5 text-[13px] w-28 focus:outline-none" onchange="renderImTable()">
            <option value="">全部</option>
            <option>启用</option>
            <option>停用</option>
          </select>
        </div>
      </div>
      <div class="flex items-center justify-center gap-3 mt-4 pt-3 border-t border-dashed border-gray-200">
        <button onclick="renderImTable()" class="btn-primary"><i class="fas fa-search mr-1"></i>查询</button>
        <button onclick="resetImFilter()" class="btn-outline"><i class="fas fa-redo-alt mr-1"></i>重置</button>
        <button id="btnBatchEnable" onclick="openBatchToggle('启用')" class="btn-primary" disabled>启用</button>
        <button id="btnBatchDisable" onclick="openBatchToggle('停用')" class="btn-primary" disabled>停用</button>
        <span id="imSelCountWrap" class="text-[13px] text-gray-500" style="display:none">已选 <b id="imSelCount" class="text-[#1872a7]">0</b> 项</span>
        <button id="imClearSel" onclick="clearImSelection()" class="text-[13px] text-gray-500 hover:text-gray-700 cursor-pointer" style="display:none">取消选择</button>
      </div>
    </div>

    <!-- 表格 -->
    <div class="overflow-x-auto">
      <table class="inv-table">
        <thead>
          <tr>
            <th style="width:46px" class="text-center"><input type="checkbox" id="imSelectAll" onclick="toggleSelectAll(this)" class="cursor-pointer" title="全选/取消全选"></th>
            <th style="width:60px">序号</th>
            <th style="width:140px">方案编号</th>
            <th style="width:90px">姓名</th>
            <th style="width:120px">手机号</th>
            <th style="width:80px">角色</th>
            <th style="width:220px">中心</th>
            <th style="width:130px">创建时间</th>
            <th style="width:90px">邀请人</th>
            <th style="width:70px">状态</th>
            <th style="width:100px">启用/停用人</th>
            <th style="width:130px">启用/停用时间</th>
            <th style="width:180px">启用/停用原因</th>
            <th style="width:90px;text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="imTableBody"></tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="px-5 py-3 flex items-center justify-between border-t border-gray-100">
      <span class="text-[12px] text-gray-500" id="imTotalCount">共 0 条</span>
      <div class="flex items-center gap-1">
        <select id="imPageSize" class="border border-gray-300 rounded px-2 py-1 text-[12px]" onchange="changeImPage(1)">
          <option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option>
        </select>
        <button onclick="changeImPage(imCurrentPage-1)" class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-chevron-left text-xs"></i></button>
        <span id="imPageNums" class="flex items-center gap-1"></span>
        <button onclick="changeImPage(imCurrentPage+1)" class="w-7 h-7 flex items-center justify-center border border-gray-300 rounded text-gray-400 hover:text-gray-600 btn-click"><i class="fas fa-chevron-right text-xs"></i></button>
        <span class="ml-2 text-[12px] text-gray-400">前往</span>
        <input type="number" value="1" min="1" id="imGoPage" class="w-9 h-7 border border-gray-300 rounded text-center text-[12px] mx-1">
        <span class="text-[12px] text-gray-400">页</span>
        <button onclick="goImPage()" class="ml-1 px-2 h-7 bg-white border border-gray-300 rounded text-[12px] text-gray-600 hover:text-gray-800 btn-click">跳转</button>
      </div>
    </div>
  </div>

  <!-- ========== 启用 / 停用原因弹窗 ========== -->
  <div id="toggleDialog" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-lg shadow-xl w-[420px] max-w-[92vw] overflow-hidden">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100">
        <span id="tgTitle" class="text-[15px] font-semibold text-gray-800">停用原因</span>
        <i class="fas fa-times text-gray-400 cursor-pointer hover:text-gray-600" onclick="closeToggleDialog()"></i>
      </div>
      <div class="px-5 py-4">
        <div id="tgSub" class="text-[12px] text-gray-500 mb-3"></div>
        <div id="tgInfo" class="mb-3 px-3 py-2 rounded bg-[#eef4ff] text-[#1872a7] text-[12px] leading-relaxed border border-[#cfe0f0]">
          <i class="fas fa-info-circle mr-1"></i>启用 / 停用 仅变更该成员在「<span id="tgInfoCenter"></span>」的状态，不影响其他中心的授权与可见范围。
        </div>
        <div class="text-[13px] text-gray-600 mb-2">
          <span id="tgLabel">停用原因</span>
        </div>
        <textarea id="tgReason" rows="3" placeholder="请输入原因"
          class="w-full border border-gray-300 rounded px-3 py-2 text-[13px] focus:outline-none form-input resize-none"></textarea>
        <div id="tgHint" class="mt-1.5 text-[12px] text-[#F53F3F]" style="display:none">请填写原因后再提交</div>
      </div>
      <div class="flex justify-end gap-3 px-5 py-3.5 border-t border-gray-100 bg-gray-50">
        <button onclick="closeToggleDialog()" class="btn-outline">取消</button>
        <button onclick="confirmToggle()" id="tgOkBtn" class="btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- ========== 操作提醒弹窗（混选/异常提示） ========== -->
  <div id="alertDialog" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-lg shadow-xl w-[400px] max-w-[92vw] overflow-hidden">
      <div class="flex items-start gap-3 px-5 pt-5 pb-3">
        <i class="fas fa-exclamation-triangle text-[#ff7d00] text-[26px] mt-0.5 leading-none"></i>
        <div class="flex-1">
          <div id="alertTitle" class="text-[15px] font-semibold text-gray-800 mb-1.5">操作提醒</div>
          <div id="alertMsg" class="text-[13px] text-gray-600 leading-relaxed"></div>
        </div>
      </div>
      <div class="flex justify-end gap-2 px-5 py-3 border-t border-gray-100 bg-gray-50">
        <button onclick="closeAlertDialog()" class="btn-primary">知道了</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 项目切换（上层Tab） ====================
    var currentProject = 0;
    function switchProject(idx) {
      currentProject = idx;
      for (var i = 0; i < 3; i++) {
        document.getElementById('projTab' + i).classList.toggle('active', i === idx);
      }
      // 切换项目后刷新当前Tab数据（邀请码列表面板若已移除，则只刷新已邀请成员）
      var icPanel = document.getElementById('panelInviteCode');
      if (icPanel && !icPanel.classList.contains('hidden')) {
        renderIcTable();
      } else {
        renderImTable();
      }
      showToast('已切换到 ' + ['恒瑞医药','江苏科信','运营二部'][idx], 'success');
    }

    // ==================== 功能Tab切换（下层） ====================
    function switchTab(tab) {
      var icTab = document.getElementById('tabInviteCode');
      var imTab = document.getElementById('tabInvitedMember');
      var icPanel = document.getElementById('panelInviteCode');
      var imPanel = document.getElementById('panelInvitedMember');
      if (icTab) icTab.classList.toggle('active', tab === 'inviteCode');
      if (imTab) imTab.classList.toggle('active', tab === 'invitedMember');
      if (icPanel) icPanel.classList.toggle('hidden', tab !== 'inviteCode');
      if (imPanel) imPanel.classList.toggle('hidden', tab !== 'invitedMember');
      if (tab === 'inviteCode' && icPanel) renderIcTable();
      if (tab === 'invitedMember') renderImTable();
    }

    // ==================== Toast ====================
    function showToast(msg, type, duration) {
      var el = document.createElement('div');
      el.className = 'toast toast-' + (type || 'success');
      var icon = type === 'success' ? 'fa-check-circle'
               : type === 'error' ? 'fa-times-circle'
               : type === 'warn' ? 'fa-exclamation-triangle'
               : 'fa-info-circle';
      el.innerHTML = '<i class="fas ' + icon + '"></i>' + msg;
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, duration || 2000);
    }

    // ==================== 居中提醒弹窗（强提示，需用户确认） ====================
    function showAlert(msg, title) {
      document.getElementById('alertTitle').textContent = title || '操作提醒';
      document.getElementById('alertMsg').textContent = msg;
      document.getElementById('alertDialog').classList.remove('hidden');
    }
    function closeAlertDialog() {
      document.getElementById('alertDialog').classList.add('hidden');
    }

    // ==================== 邀请码列表数据 & 渲染 ====================
    var icMockData = [
      { projectNo: '高癌血症·1918-302', centerName: 'CN043·宜昌市中心人民医院·曹朝阳', creator: '胡雷' },
      { projectNo: 'HR99531-310', centerName: 'CN111·温州市第三人民医院·张敏', creator: '江小慧' },
      { projectNo: 'HR99531-310', centerName: 'CN140·昆山市超医院·詹一兵', creator: '凌云云' },
      { projectNo: '2102-102', centerName: 'CN054·天津肿瘤医院空港医院·王忱', creator: '蔡伟然' },

    function getFilteredIm() {

      var fPhone = (document.getElementById('imFilterPhone').value || '').trim().toLowerCase();
      var fCenterName = (document.getElementById('imFilterCenterName').value || '').trim().toLowerCase();
      var fCenterNo = (document.getElementById('imFilterCenterNo').value || '').trim().toLowerCase();
      var fSelfInvite = document.getElementById('imFilterSelfInvite').value; // '' / yes / no
      var fStatus = document.getElementById('imFilterStatus').value;
      return imMockData.filter(function(r) {
        if (fProj && r.projectNo.toLowerCase().indexOf(fProj) === -1) return false;
        if (fName && r.name.toLowerCase().indexOf(fName) === -1) return false;
        if (fPhone && r.phone.indexOf(fPhone) === -1) return false;
        // 中心名称：匹配「CN015·唐镇市中心医院」中「·」后的名称部分
        if (fCenterName && r.center.split('·').slice(1).join('·').toLowerCase().indexOf(fCenterName) === -1) return false;
        // 中心号：匹配「·」前的编号部分
        if (fCenterNo && r.center.split('·')[0].toLowerCase().indexOf(fCenterNo) === -1) return false;
        // 我邀请的CRC：全选 / 是 / 否
        if (fSelfInvite === 'yes' && r.inviter !== CURRENT_USER) return false;
        if (fSelfInvite === 'no' && r.inviter === CURRENT_USER) return false;
        if (fStatus && r.status !== fStatus) return false;
        return true;
      });

    // ==================== 批量选择 ====================
    var selectedImIds = []; // 跨页保留的已选成员 id 列表

    function onRowCheck(cb) {
      var id = cb.value;
      if (cb.checked) {
        if (selectedImIds.indexOf(id) < 0) selectedImIds.push(id);
      } else {
        selectedImIds = selectedImIds.filter(function(x) { return x !== id; });
      }
      updateImSelectionUI();
    }

    function toggleSelectAll(cb) {
      var allFiltered = getFilteredIm();
      if (cb.checked) {
        allFiltered.forEach(function(r) {
          if (selectedImIds.indexOf(r.id) < 0) selectedImIds.push(r.id);
        });
      } else {
        var filteredIds = allFiltered.map(function(r) { return r.id; });
        selectedImIds = selectedImIds.filter(function(id) { return filteredIds.indexOf(id) < 0; });
      }
      renderImTable(); // 重渲染以回显勾选框，内部会调用 updateImSelectionUI
    }

    function clearImSelection() {
      selectedImIds = [];
      renderImTable();
    }

    function updateImSelectionUI() {
      var selCount = selectedImIds.length;
      var hasSel = selCount > 0;
      var cnt = document.getElementById('imSelCount');
      var wrap = document.getElementById('imSelCountWrap');
      var clearBtn = document.getElementById('imClearSel');
      var btnEnable = document.getElementById('btnBatchEnable');
      var btnDisable = document.getElementById('btnBatchDisable');
      var allBox = document.getElementById('imSelectAll');
      if (cnt) cnt.textContent = selCount;
      if (wrap) wrap.style.display = hasSel ? 'inline' : 'none';
      if (clearBtn) clearBtn.style.display = hasSel ? 'inline' : 'none';
      if (btnEnable) btnEnable.disabled = !hasSel;
      if (btnDisable) btnDisable.disabled = !hasSel;
      if (allBox) {
        var allFiltered = getFilteredIm();
        var total = allFiltered.length;
        var selInFiltered = allFiltered.filter(function(r) { return selectedImIds.indexOf(r.id) >= 0; }).length;
        allBox.checked = total > 0 && selInFiltered === total;
        allBox.indeterminate = selInFiltered > 0 && selInFiltered < total;
      }
    }

    // ==================== 启用 / 停用（填写原因） ====================
    var toggleTarget = null; // 单条：{ id, name, center, newStatus }；批量：{ ids:[...], newStatus }

    function openToggleDialog(id, newStatus) {
      var row = imMockData.find(function(x) { return x.id === id; });
      if (!row) return;
      toggleTarget = { id: id, name: row.name, center: row.center, newStatus: newStatus };
      document.getElementById('tgTitle').textContent = newStatus + '原因';
      document.getElementById('tgLabel').textContent = newStatus + '原因';
      document.getElementById('tgSub').textContent = row.name + ' · ' + row.center;
      document.getElementById('tgInfoCenter').textContent = row.center;
      document.getElementById('tgOkBtn').textContent = '确定' + newStatus;
      document.getElementById('tgReason').value = '';
      document.getElementById('tgHint').style.display = 'none';
      document.getElementById('toggleDialog').classList.remove('hidden');
    }

    function closeToggleDialog() {
      document.getElementById('toggleDialog').classList.add('hidden');
      toggleTarget = null;
    }

    // 批量启用 / 停用：弹出同一个原因弹窗，仅对状态不符的成员生效
    function openBatchToggle(newStatus) {
      var selectedRows = imMockData.filter(function(r) { return selectedImIds.indexOf(r.id) >= 0; });
      if (selectedRows.length === 0) {
        showToast('请先勾选要操作的成员', 'warn');
        return;
      }
      // 选中数据同时包含「启用」与「停用」→ 提示并让用户重新勾选
      var hasEnable = selectedRows.some(function(r) { return r.status === '启用'; });
      var hasDisable = selectedRows.some(function(r) { return r.status === '停用'; });
      if (hasEnable && hasDisable) {
        showAlert('所选成员同时包含「启用」和「停用」两种状态，请重新勾选同一状态的成员后再操作。', '提醒');
        return;
      }
      var applicable = selectedRows.filter(function(r) { return r.status !== newStatus; });
      if (applicable.length === 0) {
        showAlert('所选 ' + selectedRows.length + ' 个成员均已处于「' + newStatus + '」状态，无需重复' + newStatus + '。', '操作提醒');
        return;
      }
      toggleTarget = { ids: applicable.map(function(r) { return r.id; }), newStatus: newStatus };
      document.getElementById('tgTitle').textContent = '批量' + newStatus;
      document.getElementById('tgLabel').textContent = newStatus + '原因';
      document.getElementById('tgSub').textContent = '已选 ' + selectedRows.length + ' 个成员，将对其中的 ' + applicable.length + ' 个执行' + newStatus;
      document.getElementById('tgInfoCenter').textContent = '各自所属中心';
      document.getElementById('tgOkBtn').textContent = '确定' + newStatus;

      document.getElementById('tgReason').value = '';
      document.getElementById('tgHint').style.display = 'none';
      document.getElementById('toggleDialog').classList.remove('hidden');
    }

    function confirmToggle() {
      if (!toggleTarget) return;
      var reason = (document.getElementById('tgReason').value || '').trim();
      if (!reason) {
        document.getElementById('tgHint').style.display = 'block';
        return;
      }
      var tStatus = toggleTarget.newStatus;
      if (toggleTarget.ids) {
        var cnt = 0;
        imMockData.forEach(function(x) {
          if (toggleTarget.ids.indexOf(x.id) >= 0 && x.status !== tStatus) {
            x.status = tStatus;
            x.toggleBy = CURRENT_USER;
            x.toggleTime = formatNow();
            x.toggleReason = reason;
            cnt++;
          }
        });
        closeToggleDialog();
        renderImTable();
        showToast('已批量' + tStatus + ' ' + cnt + ' 个成员', tStatus === '启用' ? 'success' : 'warn');
      } else {
        var tName = toggleTarget.name, tCenter = toggleTarget.center;
        var m = imMockData.find(function(x) { return x.id === toggleTarget.id; });
        if (m) {
          m.status = tStatus;
          m.toggleBy = CURRENT_USER;
          m.toggleTime = formatNow();
          m.toggleReason = reason;
        }
        closeToggleDialog();
        renderImTable();
        showToast(tName + '（' + tCenter + '）已' + tStatus, tStatus === '启用' ? 'success' : 'warn');
      }
    }

    function formatNow() {
      var d = new Date();
      var p = function(n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    window.addEventListener('DOMContentLoaded', function() {
      if (document.getElementById('panelInviteCode')) renderIcTable();
      renderImTable();
    });

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>阶段审核 - 需求详细说明</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    line-height: 1.8;
  }
  .top-bar {
    background: linear-gradient(135deg, #1677ff, #0958d9);
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(22,119,255,0.3);
  }
  .top-bar h1 { font-size: 18px; font-weight: 600; }
  .top-bar a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 6px; transition: all 0.2s; }
  .top-bar a:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .content-container {
    max-width: 960px;
    margin: 32px auto;
    padding: 40px 48px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .content-container h1 { font-size: 28px; margin-bottom: 8px; color: #1677ff; border-bottom: 2px solid #1677ff; padding-bottom: 10px; }
  .content-container h2 { font-size: 22px; margin-top: 36px; margin-bottom: 14px; color: #333; border-left: 4px solid #1677ff; padding-left: 12px; }
  .content-container h3 { font-size: 18px; margin-top: 24px; margin-bottom: 10px; color: #555; }
  .content-container h4 { font-size: 15px; margin-top: 18px; margin-bottom: 8px; color: #666; }
  .content-container p { margin-bottom: 12px; }
  .content-container table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 24px;
    font-size: 13px;
  }
  .content-container table th {
    background: #1677ff;
    color: #fff;
    padding: 10px 12px;
    text-align: left;
    font-weight: 500;
  }
  .content-container table td {
    padding: 9px 12px;
    border-bottom: 1px solid #eee;
  }
  .content-container table tr:nth-child(even) td { background: #fafafa; }
  .content-container table tr:hover td { background: #f0f5ff; }
  .content-container code {
    background: #f5f5f5;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    color: #e03131;
  }
  .content-container pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 20px 24px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.7;
  }
  .content-container pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }
  .content-container ul, .content-container ol { margin: 10px 0 16px 24px; }
  .content-container li { margin-bottom: 6px; }
  .content-container hr { border: none; border-top: 1px solid #eee; margin: 30px 0; }
  .content-container blockquote {
    border-left: 4px solid #e8e8e8;
    padding-left: 16px;
    color: #888;
    margin: 16px 0;
  }
  .content-container strong { color: #333; }
  .loading { text-align: center; padding: 80px; color: #999; font-size: 15px; }
  .loading i { font-size: 32px; color: #1677ff; display: block; margin-bottom: 16px; }
  .toc {
    background: #f8faff;
    border: 1px solid #e0e8f7;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .toc h3 { margin-top: 0 !important; font-size: 14px; color: #1677ff; }
  .toc ul { margin: 8px 0 0 18px; font-size: 13px; }
  .toc li { margin-bottom: 3px; }
  .toc a { color: #555; text-decoration: none; }
  .toc a:hover { color: #1677ff; text-decoration: underline; }

  @media (max-width: 768px) {
    .content-container { margin: 16px; padding: 20px; }
    .top-bar { padding: 12px 16px; }
    .top-bar h1 { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="top-bar">
  <h1><i class="fas fa-file-alt" style="margin-right:8px;"></i>阶段审核 - 需求详细说明</h1>
  <a href="javascript:window.close();"><i class="fas fa-arrow-left" style="margin-right:4px;"></i>返回系统</a>
</div>
<div class="content-container" id="content">
  <div class="loading">
    <i class="fas fa-spinner fa-spin"></i>
    正在加载需求文档...
  </div>
</div>

<script>
async function loadMarkdown() {
  try {
    const response = await fetch('阶段审核-需求文档.md');
    if (!response.ok) throw new Error('加载失败: ' + response.status);
    const mdText = await response.text();
    const html = marked.parse(mdText);
    document.getElementById('content').innerHTML = html;

    // Auto link TOC headings
    const headings = document.querySelectorAll('#content h2');
    if (headings.length > 0) {
      const toc = document.createElement('div');
      toc.className = 'toc';
      toc.innerHTML = '<h3><i class="fas fa-list" style="margin-right:6px;"></i>目录</h3><ul>' +
        Array.from(headings).map((h, i) => {
          const id = 'sec-' + i;
          h.id = id;
          return '<li><a href="#' + id + '">' + h.textContent + '</a></li>';
        }).join('') + '</ul>';
      document.getElementById('content').prepend(toc);
    }
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="loading" style="color:#f53f3f;"><i class="fas fa-exclamation-circle"></i>加载失败: ' + err.message + '</div>';
  }
}

loadMarkdown();
</script>
</body>
</html>

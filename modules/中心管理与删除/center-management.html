<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参研中心 [SHR-A2102-203]</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .data-table th { background-color: #f5f7fa; font-weight: 600; color: #333; font-size: 13px; }
    .data-table td { font-size: 13px; color: #333; }
    .data-table tbody tr:hover { background-color: #f7faff; }
    .tag-green { background-color: #e8ffea; color: #00b42a; }
    .tag-gray { background-color: #f2f3f5; color: #4e5969; }
    input::placeholder, select option:first-child { color: #bfbfbf; }
  </style>
</head>
<body class="bg-gray-100">

  <!-- 顶部导航 -->
  <header class="bg-white border-b border-gray-200 h-14 flex items-center justify-between px-6 sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-[#165DFF] rounded flex items-center justify-center text-white">
        <i class="fas fa-hospital text-sm"></i>
      </div>
      <span class="text-[15px] font-medium text-gray-800">临床研究管理系统</span>
    </div>
    <div class="flex items-center gap-4 text-gray-600">
      <span class="text-[13px]"><i class="fas fa-user-circle mr-1"></i>管理员</span>
      <i class="fas fa-bell text-gray-500"></i>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="p-5">
    <div class="mb-4">
      <h2 class="text-[18px] font-bold text-gray-800">参研中心 <span class="font-normal text-gray-500">[SHR-A2102-203]</span></h2>
    </div>

    <!-- 搜索与操作栏（同一卡片） -->
    <div class="bg-white border border-gray-200 rounded p-4 mb-3">
      <!-- 搜索条件行 -->
      <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-700">中心名称：</label>
          <input type="text" placeholder="请输入" class="border border-gray-300 rounded px-2.5 py-1 text-[13px] w-40 focus:border-[#165DFF] outline-none">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-700">中心号：</label>
          <input type="text" placeholder="请输入" class="border border-gray-300 rounded px-2.5 py-1 text-[13px] w-40 focus:border-[#165DFF] outline-none">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-700">省市：</label>
          <select class="border border-gray-300 rounded px-2.5 py-1 text-[13px] w-40 focus:border-[#165DFF] outline-none text-gray-400">
            <option>请选择</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[13px] text-gray-700">启动状态：</label>
          <select class="border border-gray-300 rounded px-2.5 py-1 text-[13px] w-40 focus:border-[#165DFF] outline-none text-gray-400">
            <option>请选择</option>
          </select>
        </div>
      </div>
      <!-- 按钮行（居中） -->
      <div class="flex items-center justify-center gap-2 mt-3">
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px] flex items-center gap-1"><i class="fas fa-search text-xs"></i>查询</button>
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px] flex items-center gap-1"><i class="fas fa-redo text-xs"></i>重置</button>
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px] flex items-center gap-1"><i class="fas fa-plus text-xs"></i>新增中心</button>
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px]">下载导入模板</button>
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px] flex items-center gap-1"><i class="fas fa-upload text-xs"></i>导入</button>
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px] flex items-center gap-1"><i class="fas fa-download text-xs"></i>导出</button>
        <button class="bg-[#165DFF] text-white px-4 py-1.5 rounded text-[13px] flex items-center gap-1"><i class="fas fa-trash-alt text-xs"></i>删除选中 (0)</button>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white border border-gray-200 rounded overflow-x-auto">
      <table class="data-table w-full text-left border-collapse">
        <thead>
          <tr>
            <th class="px-3 py-2.5 border-b border-gray-200 text-center w-10"></th>
            <th class="px-3 py-2.5 border-b border-gray-200">中心名称</th>
            <th class="px-3 py-2.5 border-b border-gray-200">科室</th>
            <th class="px-3 py-2.5 border-b border-gray-200">中心号</th>
            <th class="px-3 py-2.5 border-b border-gray-200">PI</th>
            <th class="px-3 py-2.5 border-b border-gray-200 text-center">合同例数</th>
            <th class="px-3 py-2.5 border-b border-gray-200">省份</th>
            <th class="px-3 py-2.5 border-b border-gray-200">城市</th>
            <th class="px-3 py-2.5 border-b border-gray-200 text-center">是否组长单位</th>
            <th class="px-3 py-2.5 border-b border-gray-200 text-center">中心状态</th>
            <th class="px-3 py-2.5 border-b border-gray-200 text-center">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b border-gray-100">
            <td class="px-3 py-2.5 text-center"><input type="checkbox"></td>
            <td class="px-3 py-2.5 font-medium">山东省肿瘤医院</td>
            <td class="px-3 py-2.5 text-gray-500"></td>
            <td class="px-3 py-2.5 text-[#165DFF]">CN001</td>
            <td class="px-3 py-2.5">于金明</td>
            <td class="px-3 py-2.5 text-center"></td>
            <td class="px-3 py-2.5">山东省</td>
            <td class="px-3 py-2.5">济南市</td>
            <td class="px-3 py-2.5 text-center"><span class="px-2 py-0.5 rounded text-[12px] tag-green">是</span></td>
            <td class="px-3 py-2.5 text-center"><span class="px-2 py-0.5 rounded text-[12px] tag-green">已启动</span></td>
            <td class="px-3 py-2.5 text-center whitespace-nowrap">
              <a class="text-[#165DFF] text-[13px] cursor-pointer">编辑</a>
              <a class="text-[#165DFF] text-[13px] cursor-pointer ml-2">审批流程设置</a>
              <a class="text-red-500 text-[13px] cursor-pointer ml-2">删除</a>
            </td>
          </tr>
          <tr>
            <td class="px-3 py-2.5 text-center"><input type="checkbox"></td>
            <td class="px-3 py-2.5 font-medium">安阳市人民医院</td>
            <td class="px-3 py-2.5 text-gray-500"></td>
            <td class="px-3 py-2.5 text-[#165DFF]">CN</td>
            <td class="px-3 py-2.5">王</td>
            <td class="px-3 py-2.5 text-center"></td>
            <td class="px-3 py-2.5">河南省</td>
            <td class="px-3 py-2.5">安阳市</td>
            <td class="px-3 py-2.5 text-center"><span class="px-2 py-0.5 rounded text-[12px] tag-gray">否</span></td>
            <td class="px-3 py-2.5 text-center"><span class="px-2 py-0.5 rounded text-[12px] tag-green">已启动</span></td>
            <td class="px-3 py-2.5 text-center whitespace-nowrap">
              <a class="text-[#165DFF] text-[13px] cursor-pointer">编辑</a>
              <a class="text-[#165DFF] text-[13px] cursor-pointer ml-2">审批流程设置</a>
              <a class="text-red-500 text-[13px] cursor-pointer ml-2">删除</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="flex items-center justify-between mt-3 text-[13px]">
      <span class="text-gray-500">共 2 条</span>
      <div class="flex items-center gap-2">
        <select class="border border-gray-300 rounded px-2 py-1 text-gray-700">
          <option>10条/页</option>
          <option>20条/页</option>
          <option>50条/页</option>
        </select>
        <button class="px-2 py-1 border border-gray-300 rounded text-gray-500"><i class="fas fa-chevron-left text-xs"></i></button>
        <button class="px-3 py-1 border border-gray-300 rounded bg-[#165DFF] text-white">1</button>
        <button class="px-2 py-1 border border-gray-300 rounded text-gray-500"><i class="fas fa-chevron-right text-xs"></i></button>
        <span class="text-gray-500 ml-1">前往</span>
        <input type="text" value="1" class="border border-gray-300 rounded w-10 px-1 py-1 text-center">
        <span class="text-gray-500">页</span>
      </div>
    </div>
  </main>

</body>
</html>

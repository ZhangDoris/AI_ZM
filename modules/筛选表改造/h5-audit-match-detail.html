<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #333; background: #f0f2f5;
    }
    body { display: flex; min-height: 100vh; }

    /* 左侧手机壳 */
    .phone-stage {
      flex: 0 0 82%; padding: 24px;
      display: flex; align-items: flex-start; justify-content: center;
      background: #f5f7fa;
    }
    .phone-frame {
      position: relative; width: 390px; background: #fff;
      border-radius: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12), 0 0 0 8px #1a1a1a, 0 0 0 10px #2c2c2c;
      overflow: hidden;
    }
    .vconsole-badge {
      position: absolute; top: 12px; left: -2px;
      background: #07c160; color: #fff;
      padding: 6px 14px 6px 10px; font-size: 13px; font-weight: 700;
      border-radius: 0 4px 4px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 50; letter-spacing: 0.3px;
    }
    .phone-screen {
      width: 100%; height: 700px; overflow-y: auto;
      padding: 0; background: #f5f6f8; position: relative;
    }

    /* ====== 顶部导航栏（截图一致）====== */
    .nav-header {
      background: #fff; padding: 10px 14px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 20;
    }
    .nav-back {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: #1677ff; font-size: 15px; cursor: pointer; flex-shrink: 0;
    }
    .nav-title {
      font-size: 15px; font-weight: 600; color: #1a1a1a;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-tag-super {
      background: #1677ff; color: #fff;
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 10px; flex-shrink: 0;
    }

    /* ====== 版本切换栏（截图一致）====== */
    .version-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: #fff; border-bottom: 1px solid #f0f0f0;
    }
    .version-label { font-size: 12px; color: #999; }
    .version-btn {
      padding: 4px 14px; border: 1px solid #d9d9d9; border-radius: 4px;
      font-size: 12px; color: #666; background: #fff; cursor: pointer;
    }
    .version-btn.active { border-color: #1677ff; color: #1677ff; background: #e6f4ff; font-weight: 500; }

    /* ====== 三Tab（截图一致）====== */
    .md-tabs { display: flex; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .md-tab {
      flex: 1; text-align: center; padding: 12px 0; font-size: 14px;
      color: #666; cursor: pointer; position: relative;
    }
    .md-tab.active { color: #1677ff; font-weight: 600; }
    .md-tab.active::after {
      content: ""; position: absolute; left: 50%; bottom: 0;
      transform: translateX(-50%); width: 28px; height: 3px;
      background: #1677ff; border-radius: 2px;
    }

    /* ====== 患者信息头部卡片（截图一致）====== */
    .patient-head-card {
      margin: 12px 12px 0; background: #fff; border-radius: 8px; padding: 14px 16px;
    }
    .patient-head-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .patient-name-row { display: flex; align-items: baseline; gap: 6px; }
    .patient-name { font-size: 18px; font-weight: 700; color: #1a1a1a; }
    .patient-age { font-size: 14px; color: #666; }
    .patient-status { font-size: 13px; color: #999; }
    .patient-edit-icon {
      color: #1677ff; font-size: 15px; cursor: pointer; flex-shrink: 0;
    }
    .patient-disease { font-size: 13px; color: #666; margin-top: 6px; }
    .patient-disease b { color: #333; font-weight: 500; }

    /* ====== 病史与资料行（截图一致）====== */
    .materials-row {
      margin: 10px 12px 0; background: #fff; border-radius: 8px;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .materials-left { display: flex; align-items: center; gap: 8px; }
    .materials-icon-wrap {
      width: 36px; height: 36px; border-radius: 8px;
      background: #e6f4ff; display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; position: relative;
    }
    .materials-icon-wrap i { color: #1677ff; font-size: 16px; }
    .materials-count-badge {
      position: absolute; top: -4px; right: -4px;
      background: #1677ff; color: #fff; font-size: 10px; font-weight: 600;
      min-width: 16px; height: 16px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0 4px;
    }
    .materials-label { font-size: 14px; color: #333; }
    .btn-mark-reserve {
      background: #1677ff; color: #fff; border: none;
      padding: 7px 20px; border-radius: 4px; font-size: 13px; font-weight: 500;
      cursor: pointer; flex-shrink: 0;
    }

    /* ====== 匹配度统计区（截图一致）====== */
    .match-stats-card {
      margin: 10px 12px 0; background: #fff; border-radius: 8px; padding: 16px;
    }
    .match-stats-top { display: flex; align-items: flex-start; gap: 20px; }
    .match-stats-left { display: flex; gap: 24px; flex-shrink: 0; }
    .match-stat-item { text-align: center; }
    .match-stat-val { font-size: 26px; font-weight: 700; color: #1a1a1a; line-height: 1.2; }
    .match-stat-val.highlight { color: #1a1a1a; }
    .match-stat-lbl { font-size: 12px; color: #999; margin-top: 2px; }
    .match-stats-desc { font-size: 13px; color: #666; line-height: 1.65; flex: 1; }

    /* ====== AI 建议区（截图一致）====== */
    .ai-suggest-card {
      margin: 10px 12px 0; background: #fff; border-radius: 8px; padding: 14px 16px;
    }
    .ai-suggest-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; }
    .ai-conclusion-row { display: flex; align-items: flex-start; gap: 8px; line-height: 1.65; }
    .ai-icon-pending { color: #fa8c16; font-size: 15px; margin-top: 2px; flex-shrink: 0; }
    .ai-icon-pass { color: #07c160; font-size: 15px; margin-top: 2px; flex-shrink: 0; }
    .ai-text { font-size: 13px; color: #333; }

    /* ====== 风险提示（截图一致）====== */
    .risk-hint-card {
      margin: 10px 12px 0; background: #fff; border-radius: 8px; padding: 12px 16px;
    }
    .risk-hint-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .risk-hint-title i { color: #fa8c16; font-size: 14px; }
    .risk-list { margin: 0; padding-left: 18px; }
    .risk-list li { font-size: 12px; color: #f53f3f; line-height: 1.85; }

    /* ====== 匹配详情 Tab 内容（新版卡片）====== */
    .md-section { padding: 10px 12px 60px; }
    .match-card-list { display: flex; flex-direction: column; gap: 12px; }
    .match-card { border: 1px solid #e8e8e8; border-radius: 8px; background: #fff; overflow: hidden; }
    .match-card-head {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px;
      background: #fafcff; border-bottom: 1px solid #f0f0f0;
    }
    .match-index {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
      background: #1677ff; color: #fff; font-size: 12px;
      display: inline-flex; align-items: center; justify-content: center; margin-top: 1px;
    }
    .match-type { font-weight: 500; color: #333; font-size: 13px; flex-shrink: 0; }
    .match-title-text { font-size: 13px; color: #333; line-height: 1.5; flex: 1; word-break: break-word; }
    .match-card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .match-result-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.6; }
    .match-result-row i { margin-top: 2px; flex-shrink: 0; font-size: 14px; }
    .match-result-row.match { color: #00B42A; }
    .match-result-row.pending { color: #FA8C16; }
    .match-result-row.exclude { color: #F53F3F; }
    .match-result-row .result-label { font-weight: 600; }
    .ai-risk-hint {
      font-size: 12px; color: #FA8C16; display: flex; align-items: center; gap: 6px;
      margin-top: 4px; padding-top: 8px; border-top: 1px dashed #eee;
    }
    .match-card-foot {
      display: flex; gap: 16px; padding: 8px 14px;
      border-top: 1px solid #f0f0f0; background: #fafafa;
    }
    .match-foot-btn { font-size: 12px; color: #1677ff; cursor: pointer; }
    .match-foot-btn.disabled { color: #bfbfbf; cursor: not-allowed; }

    /* 思考链 */
    .tc-area { padding: 14px 12px 60px; }
    .tc-empty { text-align: center; padding: 40px 20px; color: #999; }
    .tc-state { text-align: center; padding: 50px 20px; }
    .tc-state .ico { width: 72px; height: 72px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 32px; }
    .tc-state .ico.purple { background: #f3effc; color: #722ed1; }
    .tc-state .ico.red { background: #fef0ef; color: #f5222d; }
    .tc-state h4 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .tc-state h4.purple { color: #722ed1; }
    .tc-state h4.red { color: #f5222d; }
    .tc-state .desc { font-size: 13px; color: #666; margin-bottom: 18px; line-height: 1.6; }
    .tc-state .btn-row { display: flex; gap: 10px; justify-content: center; }
    .tc-state button { padding: 8px 18px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; }
    .btn-blue { background: #1677ff; color: #fff; }
    .btn-blue-line { background: #fff; color: #1677ff; border: 1px solid #1677ff !important; }

    .tc-type-selector { display: flex; gap: 8px; margin-bottom: 10px; }
    .tc-type-btn { padding: 5px 12px; border: 1px solid #d9d9d9; background: #fff; color: #666; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .tc-type-btn.tc-type-active { border-color: #1677ff; color: #1677ff; background: #f0f5ff; font-weight: 600; }

    .tc-item { border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; margin-bottom: 10px; background: #fff; }
    .tc-item .hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; background: #fafcff; }
    .tc-item .num { width: 22px; height: 22px; border-radius: 50%; background: #722ed1; color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tc-item .nm { font-size: 14px; font-weight: 600; color: #1a1a1a; flex: 1; }
    .tc-item .ok-tag { font-size: 11px; color: #07c160; background: #e6f7ec; padding: 1px 8px; border-radius: 10px; }
    .tc-item .body { padding: 12px 14px; font-size: 13px; color: #333; line-height: 1.7; display: none; white-space: pre-wrap; }
    .tc-item.open .body { display: block; }
    .disclaimer { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: #999; margin-top: 12px; line-height: 1.6; }

    .hidden { display: none !important; }

    /* ====== 审核列表屏（保留）====== */
    .phone-header-old {
      background: #fff; padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 20;
    }
    .phone-title { font-size: 17px; font-weight: 600; color: #1a1a1a; }
    .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .tab-bar .tab { flex: 1; text-align: center; padding: 12px 0; font-size: 15px; color: #333; position: relative; cursor: pointer; }
    .tab-bar .tab.active { color: #1677ff; font-weight: 600; }
    .tab-bar .tab.active::after { content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 28px; height: 3px; background: #1677ff; border-radius: 2px; }

    .audit-card { background: #fff; margin: 10px 12px; border-radius: 8px; overflow: hidden; }
    .audit-card .hd { padding: 12px 14px 6px; display: flex; align-items: center; gap: 8px; }
    .audit-card .name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .audit-card .meta { font-size: 12px; color: #999; }
    .audit-card .pill { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
    .pill-blue { background: #e6f4ff; color: #1677ff; }
    .pill-orange { background: #fff4e6; color: #fa8c16; }
    .pill-green { background: #e6f7ec; color: #07c160; }
    .pill-audit-name { background: #f0f5ff; color: #2b5aed; font-weight: 500; }
    .audit-card .body { padding: 8px 14px; }
    .audit-card .row { display: flex; font-size: 13px; line-height: 22px; color: #333; }
    .audit-card .row .lbl { color: #999; min-width: 78px; flex-shrink: 0; }
    .audit-card .row .val { flex: 1; }
    .audit-card .pct-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; }
    .pct-pill { display: inline-block; padding: 4px 10px; border-radius: 4px; background: #fa8c16; color: #fff; font-size: 13px; font-weight: 600; }
    .audit-card .action-bar { display: flex; gap: 8px; padding: 0 14px 12px; justify-content: flex-end; }
    .audit-card .act-btn { padding: 6px 12px; border: 1px solid #1677ff; background: #fff; color: #1677ff; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .audit-card .act-btn.primary { background: #1677ff; color: #fff; }
    .audit-card .files { padding: 8px 14px 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; border-top: 1px solid #f5f5f5; }
    .audit-card .files i { color: #1677ff; font-size: 14px; }
  </style>
</head>

        return `<div class="tc-area"><div class="tc-state">
          <div class="ico purple"><i class="fas fa-spinner fa-spin"></i></div>
          <h4 class="purple">AI 正在思考中，请稍后再来</h4>
        </div></div>`;
      }
      const chains = tcResultsByType[currentTcType] || [];
      if (chains.length === 0) {
        return `<div class="tc-area">
          <div class="tc-type-selector">
            <button class="tc-type-btn ${currentTcType==='inclusion'?'tc-type-active':''}" onclick="switchTcType('inclusion')">入排条件</button>
            <button class="tc-type-btn ${currentTcType==='screening'?'tc-type-active':''}" onclick="switchTcType('screening')">筛选表</button>
          </div>
          <div class="tc-empty"><div style="font-size:32px;margin-bottom:12px">🧠</div><div>暂无该类型的思考链结果</div></div>
        </div>`;
      }
      let chainHtml = chains.map((chain, i) => `
        <div class="tc-item${i === 0 ? ' open' : ''}">
          <div class="hd" onclick="this.parentElement.classList.toggle('open')">
            <span class="num">${i + 1}</span>
            <span class="nm">${chain.name}</span>
            <span class="ok-tag">已完成</span>
          </div>
          <div class="body">${chain.markdown}</div>
        </div>`).join('');
      return `
        <div class="tc-area">
          <div class="tc-type-selector">
            <button class="tc-type-btn ${currentTcType==='inclusion'?'tc-type-active':''}" onclick="switchTcType('inclusion')">入排条件</button>
            <button class="tc-type-btn ${currentTcType==='screening'?'tc-type-active':''}" onclick="switchTcType('screening')">筛选表</button>
          </div>
          ${chainHtml}
          <div class="disclaimer"><i class="fas fa-info-circle"></i><span>以上内容由AI生成，仅供参考，请谨慎鉴别。</span></div>
        </div>`;
    }

    function switchTcType(t) { currentTcType = t; renderMdBody(); }

    // ========= 初始化 =========
    renderAuditList();
  </script>
</body>
</html>

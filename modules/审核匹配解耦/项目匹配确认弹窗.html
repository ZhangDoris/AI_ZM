<!DOCTYPE html>
<!--
  项目匹配确认弹窗 · 交互原型
  演示「项目匹配确认」二次确认弹窗：取消 / 仅项目匹配 / 匹配并预提交 三个操作。
  弹窗默认打开；关闭后可点击左下角按钮重新打开；操作后顶部弹出 Toast 反馈。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>项目匹配确认弹窗 · 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .modal-overlay { transition: opacity .2s ease; }
  .modal-card { animation: modalIn .22s ease; }
  @keyframes modalIn { from { opacity: 0; transform: scale(.96) translateY(-8px); } to { opacity: 1; transform: none; } }
  .toast { animation: toastIn .25s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body class="bg-[#f0f2f5] min-h-screen">

  <!-- 遮罩 + 弹窗 -->
  <div id="modal-overlay" class="modal-overlay fixed inset-0 bg-black/45 z-40 flex items-center justify-center p-4">
    <div class="modal-card bg-white rounded-lg shadow-2xl w-[730px] max-w-full">
      <!-- 头部 -->
      <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-100">
        <i class="fa-solid fa-magnifying-glass text-[#1677ff] text-xl"></i>
        <h3 class="text-xl font-bold text-[#333333]">项目匹配确认</h3>
        <button onclick="closeModal()" title="关闭"
          class="ml-auto w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 内容 -->
      <div class="px-6 pt-8 pb-4">
        <p class="text-xl text-[#333333] mb-6">确定要执行项目匹配吗？</p>

        <div class="bg-[#e8f3ff] border-l-4 border-[#1677ff] rounded-lg px-5 py-4">
          <div class="flex items-center gap-2 mb-3">
            <span class="w-5 h-5 rounded-full bg-[#1677ff] text-white flex items-center justify-center">
              <i class="fa-solid fa-info text-[11px]"></i>
            </span>
            <span class="text-[#1677ff] font-bold">温馨提示</span>
          </div>
          <ul class="space-y-2.5">
            <li class="flex items-start gap-2 text-sm leading-relaxed">
              <span class="w-1.5 h-1.5 rounded-full bg-[#1677ff] mt-[7px] shrink-0"></span>
              <span><b class="text-[#1677ff]">取消：</b><span class="text-[#333333]">暂时不操作。</span></span>
            </li>
            <li class="flex items-start gap-2 text-sm leading-relaxed">
              <span class="w-1.5 h-1.5 rounded-full bg-[#1677ff] mt-[7px] shrink-0"></span>
              <span><b class="text-[#1677ff]">匹配并预提交：</b><span class="text-[#333333]">提交审核和项目匹配同时进行。</span></span>
            </li>
            <li class="flex items-start gap-2 text-sm leading-relaxed">
              <span class="w-1.5 h-1.5 rounded-full bg-[#1677ff] mt-[7px] shrink-0"></span>
              <span><b class="text-[#1677ff]">仅项目匹配：</b><span class="text-[#333333]">只让 AI 先算出结果，暂不提交审批，等您看完再决定。</span></span>
            </li>
            <li class="flex items-start gap-2 text-sm leading-relaxed">
              <span class="w-1.5 h-1.5 rounded-full bg-[#1677ff] mt-[7px] shrink-0"></span>
              <span><b class="text-[#1677ff]">仅提交：</b><span class="text-[#333333]">不参与匹配，只提交审核。</span></span>
            </li>
          </ul>
        </div>
      </div>

      <!-- 底部按钮 -->
      <div class="flex items-center justify-end gap-4 px-6 py-6">
        <button onclick="closeModal('已取消，暂时不操作')"
          class="px-8 py-2 rounded-md border border-gray-300 text-[#333333] text-base hover:border-[#1677ff] hover:text-[#1677ff] transition">取消</button>
        <button onclick="confirmAction('only')"
          class="px-8 py-2 rounded-md bg-[#1677ff] text-white text-base hover:bg-[#4096ff] transition shadow-sm">仅项目匹配</button>
        <button onclick="confirmAction('pre')"
          class="px-8 py-2 rounded-md bg-[#1677ff] text-white text-base hover:bg-[#4096ff] transition shadow-sm">匹配并预提交</button>
        <button onclick="confirmAction('submit')"
          class="px-8 py-2 rounded-md bg-white border border-[#1677ff] text-[#1677ff] text-base hover:bg-[#e8f3ff] transition">仅提交</button>
      </div>
    </div>
  </div>

  <!-- 重新打开入口 -->
  <button onclick="openModal()"
    class="fixed bottom-6 left-6 z-30 flex items-center gap-2 px-4 py-2.5 rounded-full bg-[#1677ff] text-white text-sm shadow-lg hover:bg-[#4096ff] transition">
    <i class="fa-solid fa-rotate-right"></i> 重新打开弹窗
  </button>

  <!-- Toast -->
  <div id="toast" class="toast hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-white shadow-lg rounded-md px-4 py-2.5 text-sm text-[#333333] border border-gray-100">
    <i id="toast-icon" class="fa-solid fa-circle-check text-[#00B42A]"></i>
    <span id="toast-msg"></span>
  </div>

<script>
  const overlay = document.getElementById("modal-overlay");
  let toastTimer = null;

  function openModal() {
    overlay.classList.remove("hidden");
    overlay.classList.add("flex");
  }
  function closeModal(msg) {
    overlay.classList.add("hidden");
    overlay.classList.remove("flex");
    if (msg) showToast(msg, "info");
  }
  function confirmAction(type) {
    overlay.classList.add("hidden");
    overlay.classList.remove("flex");
    if (type === "only") {
      showToast("已开始项目匹配（仅匹配，暂不提交审批）");
    } else if (type === "submit") {
      showToast("已提交审核（不参与匹配）");
    } else {
      showToast("已开始匹配，完成后系统将自动发起审批（预提交）");
    }
  }
  function showToast(msg, type) {
    const t = document.getElementById("toast");
    const icon = document.getElementById("toast-icon");
    document.getElementById("toast-msg").textContent = msg;
    icon.className = type === "info"
      ? "fa-solid fa-circle-info text-[#1677ff]"
      : "fa-solid fa-circle-check text-[#00B42A]";
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
  }

  // 点击遮罩关闭
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  // Esc 关闭
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>

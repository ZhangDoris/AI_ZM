<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>选择人员</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      color: #262626;
    }
    .page {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #f5f5f5;
    }
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 16px;
      font-weight: 500;
      color: #262626;
    }
    .header-close {
      position: absolute;
      right: 0;
      top: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #595959;
      font-size: 18px;
      cursor: pointer;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .notice-box {
      position: relative;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 8px;
      padding: 12px 12px 12px 34px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.7;
    }
    .notice-box i {
      position: absolute;
      left: 12px;
      top: 12px;
      color: #faad14;
      font-size: 15px;
      line-height: 1.7;
    }
    .notice-box .line-dark { color: #595959; }
    .notice-box .line-light { color: #8c8c8c; }
    .default-notify {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .default-notify .label {
      color: #262626;
      font-weight: 500;
      flex-shrink: 0;
    }
    .default-notify .tags {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .default-notify .tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #595959;
      cursor: pointer;
    }
    .default-notify .tag input {
      width: 16px;
      height: 16px;
      accent-color: #1872a7;
      cursor: pointer;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .search-box i {
      color: #bfbfbf;
      font-size: 14px;
    }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      color: #262626;
      background: transparent;
      font-family: inherit;
    }
    .search-box input::placeholder { color: #bfbfbf; }
    .section-title {
      font-size: 13px;
      color: #8c8c8c;
      margin-bottom: 8px;
      padding-left: 2px;
    }
    .list-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
    }
    .user-item:last-child { border-bottom: none; }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-size: 15px;
      color: #262626;
      margin-bottom: 4px;
    }
    .user-meta {
      font-size: 13px;
      color: #8c8c8c;
    }
    .user-checkbox {
      width: 18px;
      height: 18px;
      margin-left: 12px;
      accent-color: #1872a7;
      cursor: pointer;
      flex-shrink: 0;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .selected-count {
      font-size: 14px;
      color: #262626;
    }
    .footer-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .footer-btn {
      font-size: 15px;
      color: #595959;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .footer-btn.primary { color: #1872a7; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <span class="header-title">选择人员</span>
      <span class="header-close" onclick="history.back()"><i class="fa fa-times"></i></span>
    </div>

    <div class="content">
      <div class="default-notify">
        <span class="label">默认通知：</span>
        <div class="tags">
          <label class="tag"><input type="checkbox" checked /><span>CRA</span></label>
          <label class="tag"><input type="checkbox" checked /><span>CRC</span></label>
        </div>
      </div>

      <div class="notice-box">
        <i class="fa fa-info-circle"></i>
        <div class="line-light">默认选中：CRC、CRA；若需修改默认，可自行修改默认通知。</div>
      </div>

      <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" placeholder="请输入关键字" />
      </div>

      <div class="section-title">可选列表</div>
      <div class="list-card" id="userList">
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">测试管理员</div>
            <div class="user-meta">CRA专员/186****1782</div>
          </div>
          <input type="checkbox" class="user-checkbox" checked onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">王海艳</div>
            <div class="user-meta">CRA专员/177****4856</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">CRA专员188</div>
            <div class="user-meta">CRA专员/188****0007</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">CRA省区管理</div>
            <div class="user-meta">CRA省区管理/188****0008</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">运营部PM</div>
            <div class="user-meta">运营部PM/188****0010</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">常余蓉</div>
            <div class="user-meta">CRA专员/159****6191</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">17798534851</div>
            <div class="user-meta">CRA专员/177****4852</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">17798534853</div>
            <div class="user-meta">CRA省区管理/177****4853</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">17798534854</div>
            <div class="user-meta">CRA管理员/177****4854</div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
        <label class="user-item">
          <div class="user-info">
            <div class="user-name">17798534855</div>
            <div class="user-meta"></div>
          </div>
          <input type="checkbox" class="user-checkbox" onchange="updateCount()" />
        </label>
      </div>
    </div>

    <div class="footer">
      <div class="selected-count">已选 <span id="count">0</span></div>
      <div class="footer-actions">
        <button class="footer-btn" onclick="history.back()">取消</button>
        <button class="footer-btn primary" onclick="alert('已确认选择')">确认</button>
      </div>
    </div>
  </div>

  <script>
    function updateCount() {
      var checked = document.querySelectorAll('.user-checkbox:checked');
      document.getElementById('count').textContent = checked.length;
    }
    updateCount();
  </script>
</body>
</html>

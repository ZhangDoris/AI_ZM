<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>接口调用日志</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f4f5fb; color: #333; }
    .page { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .page-header { margin-bottom: 20px; }
    .page-title { font-size: 20px; font-weight: 600; color: #1d2129; }
    .page-sub { font-size: 13px; color: #86909c; margin-top: 6px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(93,88,220,.08); overflow: hidden; }

    /* 查询栏 */
    .filter-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px; padding: 18px 24px; border-bottom: 1px solid #ecebf8; background: #fff; }
    .filter-item { display: flex; flex-direction: column; gap: 6px; }
    .filter-label { font-size: 13px; color: #4e5969; font-weight: 500; }
    .filter-input, .filter-select { border: 1px solid #d6d4ee; border-radius: 4px; padding: 6px 10px; font-size: 13px; color: #333; outline: none; min-width: 160px; height: 34px; background: #fff; transition: border-color .2s; }
    .filter-input:focus, .filter-select:focus { border-color: #5d58dc; }
    .filter-actions { display: flex; align-items: flex-end; gap: 10px; margin-left: auto; }
    .btn { border: none; border-radius: 4px; padding: 6px 18px; font-size: 13px; cursor: pointer; transition: all .2s; height: 34px; line-height: 22px; }
    .btn-primary { background: #5d58dc; color: #fff; }
    .btn-primary:hover { background: #4a45c4; }
    .btn-ghost { background: #fff; color: #5d58dc; border: 1px solid #5d58dc; }
    .btn-ghost:hover { background: #efeeff; }
    .btn-sm { padding: 3px 10px; height: 26px; line-height: 20px; font-size: 12px; }
    .btn-link { background: transparent; color: #5d58dc; border: none; padding: 0; height: auto; line-height: 1; font-size: 13px; }
    .btn-link:hover { color: #4a45c4; text-decoration: underline; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; }
    thead th { background: #e3e1f5; color: #1d2129; font-size: 13px; font-weight: 600; text-align: center; padding: 12px 14px; border-bottom: 1px solid #d6d4ee; white-space: nowrap; }
    tbody td { font-size: 13px; color: #1d2129; padding: 12px 14px; border-bottom: 1px solid #f2f1fb; vertical-align: middle; text-align: center; }
    th.col-left, td.col-left { text-align: left; }
    tbody tr:nth-child(even) { background: #fafaff; }
    tbody tr:hover { background: #efeeff; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; }
    .code-box { background: #f7f8fc; border: 1px solid #e3e1f5; border-radius: 4px; padding: 6px 8px; max-width: 240px; max-height: 80px; overflow: auto; white-space: pre-wrap; word-break: break-all; color: #4e5969; font-size: 12px; text-align: left; }

    /* 状态标签 */
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .tag-success { background: #e6f7ed; color: #1e8e4e; }
    .tag-fail { background: #fdeeee; color: #c93636; }

    .empty { text-align: center; padding: 48px 0; color: #86909c; font-size: 14px; }
    .pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 24px; font-size: 13px; color: #666; }
    .pager-info { margin-right: 8px; }
    .pager-select { border: 1px solid #d6d4ee; border-radius: 4px; padding: 4px 8px; color: #333; background: #fff; outline: none; }
    .pager-btn, .pager-num { border: 1px solid #d6d4ee; background: #fff; color: #666; border-radius: 4px; min-width: 30px; height: 30px; line-height: 28px; text-align: center; cursor: pointer; font-size: 13px; padding: 0 8px; }
    .pager-btn:hover, .pager-num:hover { border-color: #5d58dc; color: #5d58dc; }
    .pager-num.active { background: #5d58dc; color: #fff; border-color: #5d58dc; }
    .pager-input { border: 1px solid #d6d4ee; border-radius: 4px; width: 48px; height: 30px; text-align: center; outline: none; }
    .pager-input:focus { border-color: #5d58dc; }
    .pager-ellipsis { padding: 0 4px; color: #999; }

    /* 返回内容弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; border-radius: 8px; width: 760px; max-width: 92vw; max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(93,88,220,.25); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #ecebf8; font-size: 15px; font-weight: 600; color: #1d2129; }
    .modal-close { cursor: pointer; color: #86909c; font-size: 16px; }
    .modal-close:hover { color: #5d58dc; }
    .modal-body { padding: 16px 18px; overflow: auto; }
    .detail-info { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #ecebf8; }
    .info-row { display: flex; align-items: baseline; gap: 12px; font-size: 13px; }
    .info-label { width: 72px; flex-shrink: 0; color: #86909c; }
    .info-value { color: #1d2129; }
    .detail-section { margin-bottom: 16px; }
    .detail-title { font-size: 13px; font-weight: 600; color: #5d58dc; margin-bottom: 8px; }
    .modal-code { background: #f7f8fc; border: 1px solid #e3e1f5; border-radius: 4px; padding: 14px; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 13px; color: #2c3e50; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

    /* MCP 问答：问题为一段文字，答案为 HTML 内容直接渲染 */
    .qa-question { background: #f7f8fc; border: 1px solid #e3e1f5; border-left: 3px solid #5d58dc; border-radius: 4px; padding: 12px 14px; font-size: 13px; line-height: 1.8; color: #1d2129; }
    .qa-answer { border: 1px solid #e3e1f5; border-radius: 4px; padding: 14px 16px; font-size: 13px; line-height: 1.8; color: #1d2129; }
    .qa-answer > :first-child { margin-top: 0; }
    .qa-answer > :last-child { margin-bottom: 0; }
    .qa-answer h4 { font-size: 13px; font-weight: 600; color: #5d58dc; margin: 14px 0 6px; }
    .qa-answer h5 { font-size: 13px; font-weight: 600; color: #1d2129; margin: 10px 0 4px; }
    .qa-answer p { margin: 0 0 8px; }
    .qa-answer ul, .qa-answer ol { margin: 0 0 8px; padding-left: 20px; }
    .qa-answer ul { list-style: disc; }
    .qa-answer ol { list-style: decimal; }
    .qa-answer li { margin-bottom: 4px; }
    .qa-answer strong { font-weight: 600; }
    .qa-answer a { color: #5d58dc; }
    .qa-answer table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 12px; }
    .qa-answer th, .qa-answer td { border: 1px solid #e3e1f5; padding: 6px 8px; text-align: left; vertical-align: top; }
    .qa-answer th { background: #f2f1fb; font-weight: 600; white-space: nowrap; }
    .qa-answer .qa-error { color: #c93636; }
    .qa-answer .qa-tip { color: #86909c; font-size: 12px; }
    .modal-footer { display: flex; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid #ecebf8; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div>
        <div class="page-title">接口调用日志</div>
        <div class="page-sub">记录每一次 MCP 调用的角色、调用人、项目、时间、IP 与问答内容</div>
      </div>
    </div>

    <div class="card">
      <!-- 查询栏 -->
      <div class="filter-bar">
        <div class="filter-item">
          <label class="filter-label">角色</label>
          <select class="filter-select" id="fRole">
            <option value="">全部</option>
            <option value="超级管理员">超级管理员</option>
            <option value="管理员角色">管理员角色</option>
            <option value="CRA">CRA</option>
            <option value="CRA">CRC</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="filter-label">项目编码</label>
          <input class="filter-input" id="fProject" placeholder="如 PRJ-2023-0918" />
        </div>
        <div class="filter-item">
          <label class="filter-label">调用人</label>
          <input class="filter-input" id="fCaller" placeholder="姓名 / 手机号" />
        </div>
        <div class="filter-item">
          <label class="filter-label">调用时间</label>
          <div style="display:flex; align-items:center; gap:8px;">
            <input class="filter-input" type="datetime-local" id="fStart" style="min-width:180px" />
            <span style="color:#86909c">至</span>
            <input class="filter-input" type="datetime-local" id="fEnd" style="min-width:180px" />
          </div>
        </div>
        <div class="filter-item">
          <label class="filter-label">调用状态</label>
          <select class="filter-select" id="fStatus">
            <option value="">全部</option>
            <option value="success">成功</option>
            <option value="fail">失败</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="queryLogs()"><i class="fas fa-search"></i> 查询</button>
          <button class="btn btn-ghost" onclick="resetFilters()"><i class="fas fa-undo"></i> 重置</button>
        </div>
      </div>

      <!-- 列表 -->
      <table>
        <thead>
          <tr>
            <th class="col-left" style="width:110px">角色</th>
            <th class="col-left" style="width:180px">调用人</th>
            <th class="col-left" style="width:140px">项目编码</th>
            <th style="width:170px">调用时间</th>
            <th style="width:140px">IP 地址</th>
            <th style="width:90px">状态</th>
            <th style="width:120px">详情</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
      <div class="pager" id="pager">
        <span class="pager-info" id="totalText">共 0 条</span>
      </div>
    </div>
  </div>

  <!-- 调用详情查看弹窗 -->
  <div class="modal-mask" id="respModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <span>调用详情</span>
        <i class="fas fa-times modal-close" onclick="closeRespModal()"></i>
      </div>
      <div class="modal-body">
        <div class="detail-info" id="detailInfo"></div>
        <div class="detail-section">
          <div class="detail-title">问题</div>
          <div class="qa-question" id="qaQuestion"></div>
        </div>
        <div class="detail-section">
          <div class="detail-title">答案</div>
          <div class="qa-answer" id="qaAnswer"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeRespModal()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    // 角色：超级管理员 / 管理员角色 / 项目角色
    const LOGS = [
      {
        role: '医学经理',
        caller: '张华-138****1234',
        project: 'PRJ-2023-0918',
        time: '2026-08-25 10:12:33',
        ip: '192.168.10.23',
        question: '请帮我梳理 PRJ-2023-0918 项目中 2024 年入组、既往病史包含高血压的患者，给出患者编号、确诊时间与当前用药，并标注是否存在排除项风险。',
        answer: `<p>共检索到 <strong>3 例</strong>符合「2024 年入组 + 既往病史包含高血压」的受试者，其中 1 例命中方案排除标准，建议优先复核。</p>
<h4>患者明细</h4>
<table>
  <thead>
    <tr><th>患者编号</th><th>入组日期</th><th>确诊时间</th><th>当前用药</th><th>排除项风险</th></tr>
  </thead>
  <tbody>
    <tr><td>P10086</td><td>2024-03-05</td><td>2024-03-12</td><td>苯磺酸氨氯地平 5mg qd</td><td>无</td></tr>
    <tr><td>P10124</td><td>2024-05-18</td><td>2024-05-26</td><td>缬沙坦 80mg qd</td><td>合并用药命中排除列表</td></tr>
    <tr><td>P10237</td><td>2024-09-02</td><td>2024-09-10</td><td>暂无规律用药</td><td>无</td></tr>
  </tbody>
</table>
<h4>建议动作</h4>
<ul>
  <li>P10124 的合并用药命中方案排除标准 4.2 条，建议由医学经理复核是否继续入组。</li>
  <li>P10237 未见规律用药记录，建议补充随访记录后再评估。</li>
</ul>
<p class="qa-tip">数据来源：项目病历库（截至 2026-08-25 10:12）</p>`,
        status: 'success'
      },
      {
        role: '超级管理员',
        caller: '李敏-139****5678',
        project: 'PRJ-2023-0918',
        time: '2026-08-25 11:02:10',
        ip: '192.168.10.23',
        question: '统计本项目近 7 天 MCP 接口的调用情况，按接口维度给出调用次数、成功率与主要失败原因。',
        answer: `<p>近 7 天（08-19 ~ 08-25）累计调用 <strong>1,286 次</strong>，整体成功率 <strong>96.7%</strong>，失败集中在「获取患者病史信息」接口。</p>
<table>
  <thead>
    <tr><th>接口</th><th>调用次数</th><th>成功率</th><th>主要失败原因</th></tr>
  </thead>
  <tbody>
    <tr><td>获取患者病史信息</td><td>902</td><td>95.3%</td><td>网关超时（500）</td></tr>
    <tr><td>匹配详情核对</td><td>268</td><td>99.6%</td><td>参数缺失</td></tr>
    <tr><td>调用审计日志</td><td>116</td><td>100%</td><td>—</td></tr>
  </tbody>
</table>
<h4>处理建议</h4>
<ul>
  <li>为「获取患者病史信息」增加超时重试与结果缓存，预计可挽回约 3% 失败调用。</li>
  <li>单次查询时间跨度建议控制在 12 个月以内，可显著降低超时概率。</li>
</ul>`,
        status: 'success'
      },
      {
        role: 'CRA',
        caller: '王强-137****9012',
        project: 'PRJ-2025-1107',
        time: '2026-08-24 16:42:51',
        ip: '10.20.5.118',
        question: '受试者 S203 与研究方案 PRJ-2023-0918 的匹配情况如何？请说明命中的入排标准与未满足项。',
        answer: `<p>受试者 S203 与方案 PRJ-2023-0918 的综合匹配评分 <strong>0.87</strong>，命中 4 条入选标准，存在 1 项待补充材料。</p>
<h4>命中的入选标准</h4>
<ol>
  <li>年龄 52 岁，落在 18~65 岁区间内。</li>
  <li>性别与方案队列要求一致。</li>
  <li>既往病史包含高血压，符合目标人群定义。</li>
  <li>近 3 个月未参与其他干预性临床研究。</li>
</ol>
<h4>未满足 / 待补充</h4>
<ul>
  <li>缺少近 6 个月的实验室检查报告，无法核验排除标准 5.1 条。</li>
</ul>
<p class="qa-tip">结论：暂判定为「待补充材料」，补齐实验室检查后可再次评估。</p>`,
        status: 'success'
      },
      {
        role: '系统管理员',
        caller: '赵敏-136****3344',
        project: 'PRJ-2024-0312',
        time: '2026-08-24 17:03:20',
        ip: '10.20.5.118',
        question: '排查 PRJ-2024-0312 项目近 24 小时内 API key 失效的调用记录，给出影响范围和处理建议。',
        answer: `<p>近 24 小时内共捕获 <strong>17 次</strong>因 API key 失效（40101）导致的调用失败，涉及 3 名调用人、2 个来源 IP。</p>
<h4>影响范围</h4>
<ul>
  <li>涉及项目：PRJ-2024-0312（仅此一个项目）。</li>
  <li>涉及调用人：李敏、王强、陈静。</li>
  <li>涉及 IP：10.20.5.118、172.16.8.40。</li>
  <li>失败集中在 08-24 09:00 之后，与 key 轮换时间点一致。</li>
</ul>
<h4>处理建议</h4>
<ul>
  <li>由项目管理员在「MCP 接入配置」中重新生成 key，并同步更新到各调用方的本地配置。</li>
  <li>建议开启 key 到期前 7 天提醒，避免轮换窗口期内的批量失败。</li>
</ul>`,
        status: 'success'
      },
      {
        role: 'CRC',
        caller: '王强-137****9012',
        project: 'PRJ-2025-1107',
        time: '2026-08-23 09:31:47',
        ip: '172.16.8.40',
        question: '调取患者 P20994 在 2025 年的全部就诊记录与既往病史摘要。',
        answer: `<p class="qa-error">调用失败（500 网关超时），未生成答案。</p>
<p>建议稍后重试，或把时间范围拆分为季度分段拉取后再合并查看。</p>`,
        status: 'fail'
      },
      {
        role: '系统管理员',
        caller: '李敏-139****5678',
        project: 'PRJ-2024-0312',
        time: '2026-08-23 09:35:12',
        ip: '172.16.8.40',
        question: '导出 PRJ-2024-0312 项目本月的调用审计流水，用于合规归档。',
        answer: `<p class="qa-error">调用失败（40101 API key 已失效），未生成答案。</p>
<p>请由项目管理员在「MCP 接入配置」中重新生成 key 后再次发起导出。</p>`,
        status: 'fail'
      }
    ];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function statusTag(s) {
      return s === 'success'
        ? '<span class="tag tag-success"><i class="fas fa-check-circle"></i> 成功</span>'
        : '<span class="tag tag-fail"><i class="fas fa-times-circle"></i> 失败</span>';
    }

    let currentPage = 1;
    let pageSize = 10;

    function getFiltered() {
      const fr = document.getElementById('fRole').value;
      const fp = document.getElementById('fProject').value.trim().toLowerCase();
      const fc = document.getElementById('fCaller').value.trim().toLowerCase();
      const fStart = document.getElementById('fStart').value; // yyyy-MM-ddTHH:mm
      const fEnd = document.getElementById('fEnd').value;
      const fs = document.getElementById('fStatus').value;
      // 将日志时间 "2026-08-25 10:12:33" 转为 "2026-08-25T10:12:33" 以便比较
      const norm = t => t.replace(' ', 'T');
      return LOGS.filter(l => {
        if (fr && l.role !== fr) return false;
        if (fp && !l.project.toLowerCase().includes(fp)) return false;
        if (fc && !l.caller.toLowerCase().includes(fc)) return false;
        const lt = norm(l.time);
        if (fStart && lt < fStart) return false;
        if (fEnd && lt > fEnd) return false;
        if (fs && l.status !== fs) return false;
        return true;
      });
    }

    function renderTable() {
      const all = getFiltered();
      const total = all.length;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const start = (currentPage - 1) * pageSize;
      const list = all.slice(start, start + pageSize);
      const body = document.getElementById('logBody');
      if (list.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-inbox"></i> 暂无调用日志</td></tr>';
      } else {
        body.innerHTML = list.map((l, i) => `
          <tr>
            <td class="col-left">${escapeHtml(l.role)}</td>
            <td class="col-left">${escapeHtml(l.caller)}</td>
            <td class="col-left mono">${escapeHtml(l.project)}</td>
            <td class="mono">${escapeHtml(l.time)}</td>
            <td class="mono">${escapeHtml(l.ip)}</td>
            <td>${statusTag(l.status)}</td>
            <td><button class="btn btn-link" onclick="viewResp(${start + i})">查看详情</button></td>
          </tr>
        `).join('');
      }
      renderPager(total, totalPages);
      document.getElementById('totalText').textContent = '共 ' + total + ' 条';
    }

    function renderPager(total, totalPages) {
      const pager = document.getElementById('pager');
      let nums = [];
      if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) nums.push(i);
      } else {
        if (currentPage <= 4) {
          nums = [1, 2, 3, 4, 5, 6, '...', totalPages];
        } else if (currentPage >= totalPages - 3) {
          nums = [1, '...', totalPages - 5, totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        } else {
          nums = [1, '...', currentPage - 2, currentPage - 1, currentPage, currentPage + 1, currentPage + 2, '...', totalPages];
        }
      }
      let html = '<span class="pager-info">共 ' + total + ' 条</span>';
      html += '<select class="pager-select" onchange="changeSize(this.value)">';
      [10, 20, 50, 100].forEach(n => {
        html += '<option value="' + n + '"' + (n === pageSize ? ' selected' : '') + '>' + n + '条/页</option>';
      });
      html += '</select>';
      html += '<button class="pager-btn" onclick="changePage(currentPage - 1)">&lt;</button>';
      nums.forEach(n => {
        if (n === '...') {
          html += '<span class="pager-ellipsis">...</span>';
        } else {
          html += '<button class="pager-num ' + (n === currentPage ? 'active' : '') + '" onclick="changePage(' + n + ')">' + n + '</button>';
        }
      });
      html += '<button class="pager-btn" onclick="changePage(currentPage + 1)">&gt;</button>';
      html += '<span>前往</span><input class="pager-input" id="goPage" onkeydown="if(event.key===\'Enter\'){changePage(this.value)}" /><span>页</span>';
      pager.innerHTML = html;
    }

    function changePage(p) {
      const all = getFiltered();
      const totalPages = Math.max(1, Math.ceil(all.length / pageSize));
      let np = parseInt(p, 10);
      if (isNaN(np)) return;
      if (np < 1) np = 1;
      if (np > totalPages) np = totalPages;
      currentPage = np;
      renderTable();
    }

    function changeSize(size) {
      pageSize = parseInt(size, 10);
      currentPage = 1;
      renderTable();
    }

    function queryLogs() { currentPage = 1; renderTable(); }

    function viewResp(idx) {
      const l = getFiltered()[idx];
      if (!l) return;
      document.getElementById('detailInfo').innerHTML = `
        <div class="info-row"><span class="info-label">角色</span><span class="info-value">${escapeHtml(l.role)}</span></div>
        <div class="info-row"><span class="info-label">调用人</span><span class="info-value">${escapeHtml(l.caller)}</span></div>
        <div class="info-row"><span class="info-label">项目编码</span><span class="info-value mono">${escapeHtml(l.project)}</span></div>
        <div class="info-row"><span class="info-label">调用时间</span><span class="info-value mono">${escapeHtml(l.time)}</span></div>
        <div class="info-row"><span class="info-label">IP 地址</span><span class="info-value mono">${escapeHtml(l.ip)}</span></div>
        <div class="info-row"><span class="info-label">状态</span><span class="info-value">${statusTag(l.status)}</span></div>
      `;
      // 问题：一段纯文本
      document.getElementById('qaQuestion').textContent = l.question;
      // 答案：HTML 内容，直接渲染
      document.getElementById('qaAnswer').innerHTML = l.answer;
      document.getElementById('respModal').style.display = 'flex';
    }

    function closeRespModal() {
      document.getElementById('respModal').style.display = 'none';
    }

    document.getElementById('respModal').addEventListener('click', e => {
      if (e.target.id === 'respModal') closeRespModal();
    });

    function resetFilters() {
      document.getElementById('fRole').value = '';
      document.getElementById('fProject').value = '';
      document.getElementById('fCaller').value = '';
      document.getElementById('fStart').value = '';
      document.getElementById('fEnd').value = '';
      document.getElementById('fStatus').value = '';
      currentPage = 1;
      renderTable();
    }

    document.addEventListener('DOMContentLoaded', renderTable);
  </script>
</body>
</html>
